name: Hibou Commerce Queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hibou-commerce-queue
  cancel-in-progress: false

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://d4d5d6.com' }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deliver paid orders and revoke refunded access
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          call_commerce_endpoint() {
            local endpoint="$1"
            local attempt response_file http_code curl_rc response
            for attempt in 1 2 3; do
              response_file=$(mktemp)
              set +e
              http_code=$(curl --silent --show-error --connect-timeout 10 --max-time 90 \
                -o "$response_file" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                "${HIBOU_BASE_URL}/api/commerce/${endpoint}")
              curl_rc=$?
              set -e
              response=$(cat "$response_file")
              rm -f "$response_file"

              printf '%s http=%s curl_rc=%s attempt=%s response=%s\n' "$endpoint" "$http_code" "$curl_rc" "$attempt" "$response"

              if [ "$curl_rc" -ne 0 ]; then
                if [ "$attempt" -lt 3 ]; then
                  echo "$endpoint transport failure; retrying"
                  sleep 10
                  continue
                fi
                return "$curl_rc"
              fi

              case "$http_code" in
                200)
                  python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("status") != "manual_review"' <<< "$response"
                  return 0
                  ;;
                429|500|502|503|504)
                  if [ "$attempt" -lt 3 ]; then
                    echo "$endpoint transient HTTP $http_code; retrying"
                    sleep 10
                    continue
                  fi
                  echo "$endpoint persistent transient failure: HTTP $http_code" >&2
                  return 1
                  ;;
                *)
                  echo "$endpoint non-retriable HTTP failure: $http_code" >&2
                  return 1
                  ;;
              esac
            done
            return 1
          }

          call_commerce_endpoint revoke
          call_commerce_endpoint delivery
