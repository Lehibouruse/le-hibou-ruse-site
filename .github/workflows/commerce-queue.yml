name: Hibou Commerce Queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hibou-commerce-queue
  cancel-in-progress: false

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://d4d5d6.com' }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deliver paid orders and revoke refunded access
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          for endpoint in revoke delivery; do
            response_file=$(mktemp)
            http_code=$(curl --silent --show-error --connect-timeout 10 --max-time 90 \
              -o "$response_file" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              "${HIBOU_BASE_URL}/api/commerce/${endpoint}")
            response=$(cat "$response_file")
            rm -f "$response_file"
            printf '%s http=%s response=%s\n' "$endpoint" "$http_code" "$response"
            test "$http_code" = "200"
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("status") != "manual_review"' <<< "$response"
          done
