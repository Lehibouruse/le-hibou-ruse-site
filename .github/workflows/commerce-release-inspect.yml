name: Commerce release inspection
on:
  push:
    branches: [commerce-finish-2026-10-03]
    paths: [.github/workflows/commerce-release-inspect.yml]
permissions:
  contents: read
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the existing main-only TEST preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' '{"ref":"main","inputs":{"action":"preflight"}}' | gh api --method POST repos/Lehibouruse/le-hibou-ruse-site/actions/workflows/lemon-commerce-test.yml/dispatches --input -
          echo 'Requested dedicated TEST preflight; no purchase, discount, access override or public configuration change.'
