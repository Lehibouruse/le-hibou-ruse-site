name: Commerce release inspection
on:
  push:
    branches: [commerce-finish-2026-10-03]
    paths: [.github/workflows/commerce-release-inspect.yml]
permissions:
  contents: write
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: commerce-finish-2026-10-03
      - name: Correct incomplete configuration reads only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=['app/api/commerce/lemon-bootstrap/route.js','app/api/commerce/lemon-readiness/route.js']
          old='queryRecords(TABLES.configuration, { pageSize: 100, priorityAware: false })'
          new='queryAllRecords(TABLES.configuration, { priorityAware: false }, { maxRecords: 500 })'
          for path in paths:
              p=Path(path); text=p.read_text()
              if old in text:
                  assert text.count(old)==1
                  text=text.replace(old,new)
                  text=text.replace('createRecord, queryRecords,','createRecord, queryAllRecords, queryRecords,',1)
                  p.write_text(text)
              else:
                  assert new in text
          Path('tests/commerce-config-pagination.test.mjs').write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import { readFileSync } from "node:fs";
          for (const path of ["lemon-bootstrap", "lemon-readiness"]) {
            test(`${path} reads every configuration page and retains its authentication`, () => {
              const source = readFileSync(new URL(`../app/api/commerce/${path}/route.js`, import.meta.url), "utf8");
              assert.match(source, /queryAllRecords\\(TABLES.configuration/);
              assert.match(source, /verifyGithubActionsToken/);
              assert.doesNotMatch(source, /queryRecords\\(TABLES.configuration, \\{ pageSize: 100/);
            });
          }
          ''')
          PY
          git rm --ignore-unmatch lib/commerce-release-probe.mjs
          git add app/api/commerce/lemon-bootstrap/route.js app/api/commerce/lemon-readiness/route.js tests/commerce-config-pagination.test.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: read complete commerce configuration without changing any access or payment gate'
            git push origin HEAD:commerce-finish-2026-10-03
          fi
      - name: Report only dedicated sandbox credential availability
        env:
          LEMON_TEST_KEY: ${{ secrets.LEMON_SQUEEZY_TEST_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          print('github_dedicated_test_key_present=' + str(bool(os.environ.get('LEMON_TEST_KEY'))).lower())
          PY
      - name: Run existing browser inspection against production without purchasing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' '{"ref":"main","inputs":{"test_url":"https://d4d5d6.com"}}' | gh api --method POST repos/Lehibouruse/le-hibou-ruse-site/actions/workflows/book-store-qc.yml/dispatches --input -
          echo 'Requested production browser inspection without form submissions or purchases.'
