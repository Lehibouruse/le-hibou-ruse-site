name: Digify Contract Test

on:
  push:
    paths:
      - '.github/digify-contract-test.trigger'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise Digify add/remove contract with cleanup
        shell: bash
        env:
          HIBOU_BASE_URL: https://d4d5d6.com
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          response_file=$(mktemp)
          http_code=""
          for attempt in $(seq 1 12); do
            http_code=$(curl --silent --show-error \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "${HIBOU_BASE_URL}/api/commerce/digify-contract-test" || true)
            if [ "$http_code" = "200" ] || [ "$http_code" = "422" ] || [ "$http_code" = "409" ] || [ "$http_code" = "502" ]; then
              break
            fi
            sleep 5
          done

          echo "HTTP ${http_code}"
          cat "$response_file"
          echo
          test "$http_code" = "200"
          python3 - "$response_file" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get("ok") is True
          assert data.get("add_ok") is True
          assert data.get("remove_ok") is True
          print("add_ok=", data.get("add_ok"))
          print("remove_ok=", data.get("remove_ok"))
          print("access_url_recorded=", data.get("access_url_recorded"))
          print("add_status=", data.get("add_status"))
          print("remove_status=", data.get("remove_status"))
          PY
          rm -f "$response_file"
