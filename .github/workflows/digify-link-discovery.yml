name: Digify Developer Spec Discovery

on:
  push:
    paths:
      - '.github/digify-link-discovery.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover official Digify API schema
        shell: bash
        run: |
          set -euo pipefail
          page=$(mktemp)
          curl --silent --show-error --location 'https://developer.digify.com/' -o "$page"
          echo '=== PAGE META ==='
          wc -c "$page"
          echo '=== POSSIBLE SPEC LINKS ==='
          grep -Eo 'https?://[^"'\'' ]+|[^"'\'' ]+(openapi|swagger)[^"'\'' ]*|[^"'\'' ]+\.json' "$page" |             grep -Ei 'openapi|swagger|spec|api|json' | head -100 || true
          echo '=== SCRIPT SRC ==='
          grep -Eo 'src="[^"]+"' "$page" | head -80 || true
          echo '=== ADD RECIPIENT MARKERS ==='
          grep -Eio '.{0,220}(recipient/add|file/recipient|revoke|remove recipient|FileGUID).{0,500}' "$page" | head -80 || true

          while read -r src; do
            [ -n "$src" ] || continue
            case "$src" in
              http*) full="$src" ;;
              /*) full="https://developer.digify.com$src" ;;
              *) full="https://developer.digify.com/$src" ;;
            esac
            js=$(mktemp)
            if curl --silent --show-error --location "$full" -o "$js"; then
              if grep -qiE 'recipient/add|openapi|swagger|FileGUID|revoke' "$js"; then
                echo "=== MATCH IN $full ==="
                grep -Eio '.{0,250}(recipient/add|file/recipient|FileGUID|revoke|openapi|swagger).{0,650}' "$js" | head -100 || true
              fi
            fi
            rm -f "$js"
          done < <(grep -Eo 'src="[^"]+"' "$page" | sed -E 's/^src="|"$//g' | head -40)
          rm -f "$page"
