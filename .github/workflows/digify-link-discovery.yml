name: Digify File Search Contract Discovery

on:
  push:
    paths:
      - '.github/digify-link-discovery.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Extract file search/settings contracts
        shell: bash
        run: |
          set -euo pipefail
          spec=$(mktemp)
          curl --silent --show-error --location             'https://developer.digify.com/api/collections/21965707/UzQvu65E?environment=21965707-cc35a71f-0aec-458a-b297-402aaa3d4817&segregateAuth=true&versionTag=latest'             -o "$spec"
          python3 - "$spec" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          def walk(items,path=()):
              for item in items or []:
                  p=path+(item.get('name',''),)
                  if 'request' in item and ('search for sent file' in ' '.join(p).lower() or 'get file settings' in ' '.join(p).lower()):
                      req=item['request']; url=req.get('url')
                      if isinstance(url,dict): url=url.get('raw') or ''
                      print("\n###",' > '.join(p)); print("METHOD",req.get('method')); print("URL",url)
                      body=req.get('body') or {}; print("MODE",body.get('mode'))
                      for mode in ('urlencoded','formdata','raw'):
                          v=body.get(mode)
                          if isinstance(v,list):
                              for f in v: print(json.dumps({k:f.get(k) for k in ('key','value','description','type')},ensure_ascii=False))
                          elif isinstance(v,str): print(v[:5000])
                      for resp in item.get('response') or []:
                          print("RESPONSE",resp.get('name'),resp.get('code'))
                          print(str(resp.get('body') or '')[:10000])
                  walk(item.get('item'),p)
          walk(data.get('item'))
          PY
          rm -f "$spec"
