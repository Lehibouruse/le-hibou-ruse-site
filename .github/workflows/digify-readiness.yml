name: Hibou Digify Readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/digify-readiness.trigger'

permissions:
  contents: read
  id-token: write

concurrency:
  group: hibou-digify-readiness
  cancel-in-progress: false

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://le-hibou-ruse-site.vercel.app' }}

jobs:
  digify-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Digify configuration without side effects
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          valid_response=""
          for attempt in $(seq 1 12); do
            response_file=$(mktemp)
            http_code=$(curl --silent --show-error               -o "$response_file" -w '%{http_code}'               -X POST               -H "Authorization: Bearer ${token}"               -H "Content-Type: application/json"               --data '{}'               "${HIBOU_BASE_URL}/api/commerce/digify-readiness")
            response=$(cat "$response_file")
            rm -f "$response_file"

            printf '%s
' "$response"
            if [ "$http_code" = "200" ] && python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("mode") == "readiness_only"; assert d.get("side_effects_enabled") is False' <<< "$response"; then
              valid_response="$response"
              break
            fi

            echo "Readiness endpoint not ready yet (attempt ${attempt}/12); retrying in 10s..."
            sleep 10
          done

          if [ -z "$valid_response" ]; then
            echo "Digify readiness endpoint unavailable after retries." >&2
            exit 1
          fi

          python3 - "$GITHUB_STEP_SUMMARY" <<< "$valid_response" <<'PY'
          import json, sys
          summary_path = sys.argv[1]
          data = json.load(sys.stdin)
          blockers = data.get("blockers") or []
          lines = [
              "## Digify readiness",
              "",
              f"- Credentials visibles: **{str(bool(data.get('credentials_present'))).lower()}**",
              f"- Contrat ajout destinataire prêt: **{str(bool(data.get('recipient_contract_ready'))).lower()}**",
              f"- File GUID présent: **{str(bool(data.get('file_guid_present'))).lower()}**",
              f"- Contrat révocation prêt: **{str(bool(data.get('revocation_contract_ready'))).lower()}**",
              f"- Webhook auth prêt: **{str(bool(data.get('webhook_auth_ready'))).lower()}**",
              f"- Commerce public autorisé: **{str(bool(data.get('commerce_launch_authorized'))).lower()}**",
              "",
              f"**Blocages ({len(blockers)}):** " + (", ".join(blockers) if blockers else "aucun"),
              "",
              f"**Prochaine action:** {data.get('next_action') or 'Aucune'}",
              "",
              "_Ce workflow est diagnostic uniquement : aucun accès Digify, paiement ou destinataire n'est créé._",
          ]
          with open(summary_path, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(f"digify_blocker_count={len(blockers)}")
          print(f"digify_next_action={data.get('next_action') or ''}")
          PY
