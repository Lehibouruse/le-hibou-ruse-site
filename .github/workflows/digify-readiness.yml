name: Hibou Digify Readiness

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hibou-digify-readiness
  cancel-in-progress: false

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://le-hibou-ruse-site.vercel.app' }}

jobs:
  digify-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Digify configuration without side effects
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          response_file=$(mktemp)
          http_code=$(curl --silent --show-error \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "${HIBOU_BASE_URL}/api/commerce/digify-readiness")
          response=$(cat "$response_file")
          rm -f "$response_file"

          printf '%s\n' "$response"
          test "$http_code" = "200"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("mode") == "readiness_only"; assert d.get("side_effects_enabled") is False; print("digify_readiness_ok=true")' <<< "$response"
