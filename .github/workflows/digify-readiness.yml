name: Hibou Digify Readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/digify-readiness.trigger'

permissions:
  contents: read
  id-token: write

concurrency:
  group: hibou-digify-readiness
  cancel-in-progress: false

jobs:
  digify-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Digify readiness
        shell: bash
        env:
          HIBOU_BASE_URL: https://d4d5d6.com
        run: |
          set -euo pipefail

          token_json=$(curl -fsSL             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          response_file=$(mktemp)
          http_code=$(curl --silent --show-error             -o "$response_file"             -w '%{http_code}'             -X POST             -H "Authorization: Bearer ${token}"             -H "Content-Type: application/json"             --data '{}'             "${HIBOU_BASE_URL}/api/commerce/digify-readiness")

          response=$(cat "$response_file")
          rm -f "$response_file"

          echo "HTTP ${http_code}"
          printf '%s\n' "$response"

          test "$http_code" = "200"

          python3 - <<'PY' <<< "$response"
          import json, sys
          data = json.load(sys.stdin)
          assert data.get("ok") is True
          assert data.get("mode") == "readiness_only"
          print("credentials_present=", data.get("credentials_present"))
          print("key_id_present=", data.get("key_id_present"))
          print("secret_present=", data.get("secret_present"))
          print("file_guid_present=", data.get("file_guid_present"))
          print("recipient_contract_ready=", data.get("recipient_contract_ready"))
          print("revocation_contract_ready=", data.get("revocation_contract_ready"))
          print("webhook_auth_ready=", data.get("webhook_auth_ready"))
          print("commerce_launch_authorized=", data.get("commerce_launch_authorized"))
          print("blockers=", ",".join(data.get("blockers") or []))
          print("next_action=", data.get("next_action") or "")
          PY
