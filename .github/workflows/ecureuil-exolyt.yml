name: Ecureuil Exolyt capture

on:
  push:
    paths:
      - ".github/workflows/ecureuil-exolyt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium

      - name: Capture Exolyt data calls
        shell: bash
        run: |
          cat > cap.py <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  ctx=await b.new_context(
                    viewport={"width":1440,"height":1200},
                    locale="en-US",
                    user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
                  )
                  page=await ctx.new_page()
                  rows=[]
                  async def resp(r):
                      typ=r.request.resource_type
                      if typ in ["xhr","fetch"] or "api" in r.url.lower():
                          rec={"url":r.url,"status":r.status,"type":typ}
                          try:
                              txt=await r.text()
                              rec["bytes"]=len(txt)
                              if len(txt)<5000000: rec["body"]=txt
                              print("RESP",r.status,typ,len(txt),r.url[:700])
                          except Exception as e: rec["error"]=str(e)
                          rows.append(rec)
                  page.on("response",resp)
                  url="https://exolyt.com/user/tiktok/lefutetfute"
                  await page.goto(url,wait_until="domcontentloaded",timeout=60000)
                  await page.wait_for_timeout(12000)
                  print("TITLE",await page.title(),"URL",page.url)
                  # scroll and click likely Videos tab
                  for label in ["Videos","All videos","Top videos"]:
                      try:
                          el=page.get_by_text(label,exact=True)
                          if await el.count():
                              await el.first.click(timeout=1500)
                              await page.wait_for_timeout(5000)
                      except: pass
                  for i in range(12):
                      await page.mouse.wheel(0,5000)
                      await page.wait_for_timeout(900)
                  open("responses.json","w",encoding="utf-8").write(json.dumps(rows,ensure_ascii=False))
                  open("page.html","w",encoding="utf-8").write(await page.content())
                  print("TOTAL_RESP",len(rows))
                  await b.close()
          asyncio.run(main())
          PY
          python3 cap.py

      - name: Summarize candidate APIs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          rows=json.load(open("responses.json"))
          for r in rows:
              b=r.get("body","")
              score=sum(x.lower() in (r["url"]+" "+b[:10000]).lower() for x in ["lefutetfute","video","views","followers","tiktok"])
              if score>=2:
                  print("\nURL",r["url"])
                  print("STATUS",r["status"],"BYTES",r.get("bytes"))
                  print(b[:12000])
          PY

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ecureuil-exolyt-capture
          path: |
            responses.json
            page.html
          retention-days: 3
