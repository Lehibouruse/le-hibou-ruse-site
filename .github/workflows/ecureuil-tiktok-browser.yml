name: Ecureuil TikTok browser corpus

on:
  push:
    paths:
      - ".github/workflows/ecureuil-tiktok-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Playwright
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium

      - name: Crawl public profile
        shell: bash
        run: |
          cat > crawl.py <<'PY'
          import asyncio,json,re
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=["--disable-blink-features=AutomationControlled"])
                  context=await browser.new_context(
                      locale="fr-FR",
                      timezone_id="Europe/Paris",
                      viewport={"width":1440,"height":1100},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
                  )
                  page=await context.new_page()
                  await page.goto("https://www.tiktok.com/@lefutetfute",wait_until="domcontentloaded",timeout=60000)
                  await page.wait_for_timeout(5000)
                  print("title",await page.title())
                  print("url",page.url)
                  # dismiss likely cookie/banner buttons when present
                  for label in ["Tout accepter","Accept all","Accepter","Continue"]:
                      try:
                          b=page.get_by_role("button",name=label)
                          if await b.count(): await b.first.click(timeout=1000)
                      except: pass
                  seen={}
                  stagnant=0
                  last=0
                  for step in range(80):
                      items=await page.locator('a[href*="/@lefutetfute/video/"]').evaluate_all("""els => els.map(a => {
                        let p=a;
                        let texts=[];
                        for(let i=0;i<5 && p;i++,p=p.parentElement){ if(p.innerText) texts.push(p.innerText); }
                        let img=a.querySelector('img');
                        return {href:a.href,texts:texts,cover:img?img.src:null};
                      })""")
                      for x in items:
                          m=re.search(r'/video/(\d+)',x.get("href",""))
                          if not m: continue
                          vid=m.group(1)
                          texts=x.get("texts") or []
                          # shortest non-empty ancestor text is usually card views/count label
                          candidates=[t.strip() for t in texts if t and len(t.strip())<200]
                          seen[vid]={
                              "id":vid,
                              "url":x["href"],
                              "card_text": candidates[0] if candidates else "",
                              "ancestor_texts":candidates[:5],
                              "cover":x.get("cover")
                          }
                      if len(seen)==last: stagnant+=1
                      else: stagnant=0; last=len(seen)
                      print("step",step,"seen",len(seen),"stagnant",stagnant)
                      if len(seen)>=168 or stagnant>=8: break
                      await page.mouse.wheel(0,9000)
                      await page.wait_for_timeout(1200)
                  html=await page.content()
                  open("profile_final.html","w",encoding="utf-8").write(html)
                  open("cards.json","w",encoding="utf-8").write(json.dumps(list(seen.values()),ensure_ascii=False))
                  print("FINAL",len(seen))
                  for x in list(seen.values())[:20]: print(json.dumps(x,ensure_ascii=False))
                  await browser.close()
          asyncio.run(main())
          PY
          python3 crawl.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ecureuil-tiktok-browser-corpus
          path: |
            cards.json
            profile_final.html
          retention-days: 3
          compression-level: 6
