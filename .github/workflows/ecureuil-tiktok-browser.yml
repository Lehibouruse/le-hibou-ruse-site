name: Ecureuil TikTok browser corpus

on:
  push:
    paths:
      - ".github/workflows/ecureuil-tiktok-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Playwright
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium

      - name: Capture TikTok profile network
        shell: bash
        run: |
          cat > crawl.py <<'PY'
          import asyncio,json,re
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=["--disable-blink-features=AutomationControlled"])
                  context=await browser.new_context(
                      locale="fr-FR",timezone_id="Europe/Paris",
                      viewport={"width":1440,"height":1100},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
                  )
                  page=await context.new_page()
                  api=[]
                  async def on_response(resp):
                      u=resp.url
                      if any(x in u for x in ["/api/post/item_list","/api/user/detail","/api/item/list","item_list"]):
                          rec={"url":u,"status":resp.status}
                          try:
                              txt=await resp.text()
                              rec["body"]=txt[:2000000]
                              print("API_RESPONSE",resp.status,len(txt),u[:500])
                          except Exception as e:
                              rec["error"]=str(e)
                          api.append(rec)
                  page.on("response",on_response)
                  page.on("request",lambda req: print("API_REQUEST",req.url[:1000]) if ("item_list" in req.url or "/api/post/" in req.url) else None)
                  await page.goto("https://www.tiktok.com/@lefutetfute",wait_until="domcontentloaded",timeout=60000)
                  await page.wait_for_timeout(10000)
                  for step in range(20):
                      await page.mouse.wheel(0,6000)
                      await page.wait_for_timeout(1200)
                  await page.wait_for_timeout(5000)
                  open("api_responses.json","w",encoding="utf-8").write(json.dumps(api,ensure_ascii=False))
                  open("profile_final.html","w",encoding="utf-8").write(await page.content())
                  print("CAPTURED",len(api))
                  await browser.close()
          asyncio.run(main())
          PY
          python3 crawl.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ecureuil-tiktok-network
          path: |
            api_responses.json
            profile_final.html
          retention-days: 3
