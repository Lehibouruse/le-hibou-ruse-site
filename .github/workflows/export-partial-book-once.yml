name: Export Partial Hibou Book Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-partial-book-once.yml"

permissions:
  contents: read
  id-token: write

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://le-hibou-ruse-site.vercel.app' }}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Export current Airtable draft and render PDF
        id: export
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"
          out="$RUNNER_TEMP/hibou-book"
          mkdir -p "$out"
          headers="$out/headers.txt"
          curl --fail-with-body --silent --show-error \
            -D "$headers" \
            -H "Authorization: Bearer ${token}" \
            -H "X-Hibou-Book-Draft: true" \
            "${HIBOU_BASE_URL}/api/book-export" \
            -o "$out/book.html"
          edition=$(awk -F ': ' 'tolower($1)=="x-hibou-book-edition" {gsub("\r", "", $2); print $2}' "$headers" | tail -1)
          safe=$(printf '%s' "${edition:-draft}" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')
          [ -n "$safe" ] || safe="draft"
          html="$out/le-hibou-ruse-${safe}-partiel.html"
          pdf="$out/le-hibou-ruse-${safe}-partiel.pdf"
          mv "$out/book.html" "$html"
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$browser" ]; then
            echo "Aucun navigateur Chromium disponible sur le runner" >&2
            exit 1
          fi
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --print-to-pdf="$pdf" --no-pdf-header-footer "file://$html"
          test -s "$pdf"
          echo "edition=$safe" >> "$GITHUB_OUTPUT"
          echo "pdf=$pdf" >> "$GITHUB_OUTPUT"
          echo "html=$html" >> "$GITHUB_OUTPUT"
      - name: Upload private draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: hibou-book-partial-${{ steps.export.outputs.edition }}
          path: |
            ${{ steps.export.outputs.pdf }}
            ${{ steps.export.outputs.html }}
          if-no-files-found: error
          retention-days: 1

# one-off export retry after temporary OIDC authorization
