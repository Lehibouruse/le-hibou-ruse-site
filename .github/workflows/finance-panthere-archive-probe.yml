name: Finance Panthere archive probe

on:
  push:
    paths:
      - ".github/workflows/finance-panthere-archive-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: python3 -m pip install -q curl-cffi beautifulsoup4
      - name: Probe TikTok profile and public archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from curl_cffi import requests
          import re, json, html
          urls=[
            "https://www.tiktok.com/@financepanthere",
            "https://www.tokportal.com/tool/tiktok-profile-analytics-checker/financepanthere",
            "https://tokscribe.com/author/financepanthere",
            "https://tokscribe.com/author/financepanthere?page=2",
          ]
          for i,u in enumerate(urls):
              print("\nURL",u)
              try:
                  r=requests.get(u,impersonate="chrome",timeout=30)
                  print("HTTP",r.status_code,"BYTES",len(r.content),"FINAL",r.url)
                  open(f"page{i}.html","wb").write(r.content)
                  s=r.text
                  for pat in ["secUid","sec_uid","uniqueId","financepanthere","__NEXT_DATA__","itemList","ItemModule","webapp.user-detail"]:
                      print(pat,s.find(pat))
                  ids=sorted(set(re.findall(r'(?<!\d)7\d{18}(?!\d)',s)))
                  print("19digit_ids",len(ids),ids[:80])
                  for m in re.finditer(r'"secUid"\s*:\s*"([^"]+)"',s):
                      print("SECUID",m.group(1)[:120])
              except Exception as e:
                  print("ERR",repr(e))
          PY
      - name: Upload probe pages
        uses: actions/upload-artifact@v7
        with:
          name: finance-panthere-archive-probe
          path: page*.html
          retention-days: 2
