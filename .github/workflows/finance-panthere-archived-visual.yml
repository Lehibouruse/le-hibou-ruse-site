name: Finance Panthere archived visual corpus

on:
  push:
    paths:
      - ".github/workflows/finance-panthere-archived-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install
        run: |
          python3 -m pip install -q requests beautifulsoup4 pillow
          pipx install yt-dlp
          pipx inject yt-dlp curl-cffi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Scrape TokScribe archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,re,json,os
          from bs4 import BeautifulSoup
          base="https://tokscribe.com"
          links=[]
          for p in [1,2]:
              u=f"{base}/author/financepanthere"+("" if p==1 else "?page=2")
              h=requests.get(u,timeout=30,headers={"User-Agent":"Mozilla/5.0"}).text
              s=BeautifulSoup(h,"html.parser")
              for a in s.find_all("a",href=True):
                  href=a["href"]
                  if href.startswith("/t/") and href not in links:
                      links.append(href)
          print("TRANSCRIPT_LINKS",len(links),links)
          os.makedirs("videos",exist_ok=True)
          rows=[]
          for idx,href in enumerate(links,1):
              u=base+href
              h=requests.get(u,timeout=30,headers={"User-Agent":"Mozilla/5.0"}).text
              s=BeautifulSoup(h,"html.parser")
              text=s.get_text(" ",strip=True)
              # views / likes / duration
              m=re.search(r'([\d.]+[KMB]?) views\s+([\d.]+[KMB]?) likes\s+(\d+):(\d+)',text,re.I)
              views=m.group(1) if m else ""
              likes=m.group(2) if m else ""
              dur=(int(m.group(3))*60+int(m.group(4))) if m else 0
              title=(s.find("h1").get_text(" ",strip=True) if s.find("h1") else "")
              mp4=None
              cover=None
              og_cover=None
              tiktok=None
              for a in s.find_all("a",href=True):
                  lab=a.get_text(" ",strip=True).lower()
                  if "download mp4" in lab:
                      mp4=a["href"]
                  if "download hd cover" in lab:
                      cover=a["href"]
                  if "view on tiktok" in lab:
                      tiktok=a["href"]
              meta=s.find("meta",attrs={"property":"og:image"})
              if meta and meta.get("content"):
                  og_cover=meta.get("content")
              rows.append({"archive_url":u,"title":title,"views_label":views,"likes_label":likes,"duration":dur,"mp4":mp4,"cover":cover,"og_cover":og_cover,"tiktok":tiktok})
              print("ROW",idx,views,dur,title[:60],"MP4",bool(mp4))
          json.dump(rows,open("archive.json","w"),ensure_ascii=False,indent=2)
          PY
      - name: Download archived MP4s and extract frames
        shell: bash
        run: |
          set +e
          mkdir -p corpus
          python3 - <<'PY'
          import json,subprocess,os,re
          rows=json.load(open("archive.json"))
          def nview(x):
              if not x:return 0
              mul=1
              if x[-1:].upper()=="K":mul=1000;x=x[:-1]
              elif x[-1:].upper()=="M":mul=1000000;x=x[:-1]
              elif x[-1:].upper()=="B":mul=1000000000;x=x[:-1]
              try:return int(float(x)*mul)
              except:return 0
          rows=sorted(rows,key=lambda r:nview(r.get("views_label","")),reverse=True)
          json.dump(rows,open("ranked.json","w"),ensure_ascii=False,indent=2)
          for rank,r in enumerate(rows,1):
              d=f"corpus/{rank:02d}"
              os.makedirs(d,exist_ok=True)
              open(f"{d}/title.txt","w").write(r.get("title",""))
              open(f"{d}/views.txt","w").write(str(r.get("views_label","")))
              open(f"{d}/duration.txt","w").write(str(r.get("duration",0)))
              cover=r.get("cover") or r.get("og_cover")
              if cover:
                  subprocess.run(["curl","-L","-sS","--connect-timeout","5","--max-time","30","-A","Mozilla/5.0","-o",f"{d}/cover.jpg",cover])
              mp4=r.get("mp4")
              url=r.get("tiktok")
              ok=False
              if mp4:
                  p=subprocess.run(["curl","-L","-sS","--connect-timeout","5","--max-time","90","-A","Mozilla/5.0",
                                    "-o",f"{d}/video.mp4",mp4])
                  ok=(p.returncode==0 and os.path.exists(f"{d}/video.mp4") and os.path.getsize(f"{d}/video.mp4")>=10000)
              if not ok and url:
                  p=subprocess.run(["yt-dlp","--extractor-args","tiktok:api_hostname=api22-normal-c-useast1a.tiktokv.com",
                                    "-f","worst[ext=mp4]/worst","--no-playlist","-o",f"{d}/video.mp4",url],
                                   stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  ok=(p.returncode==0 and os.path.exists(f"{d}/video.mp4") and os.path.getsize(f"{d}/video.mp4")>=10000)
              if not ok:
                  continue
              dur=r.get("duration") or 60
              for i,frac in enumerate([.05,.25,.50,.75,.95],1):
                  t=max(.1,dur*frac)
                  subprocess.run(["ffmpeg","-loglevel","error","-ss",str(t),"-i",f"{d}/video.mp4","-frames:v","1","-q:v","3",f"{d}/frame_{i}.jpg","-y"])
              os.remove(f"{d}/video.mp4")
          PY
          echo "FRAMES=$(find corpus -name 'frame_*.jpg' | wc -l)"
      - name: Build contact sheets
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          import glob,os
          dirs=sorted(glob.glob("corpus/*"))
          os.makedirs("sheets",exist_ok=True)
          W,H=180,320
          for b in range(0,len(dirs),5):
              batch=dirs[b:b+5]
              sh=Image.new("RGB",(W*len(batch),30+H*5),"white");dr=ImageDraw.Draw(sh)
              for col,d in enumerate(batch):
                  title=open(d+"/title.txt",errors="ignore").read().strip()[:30]
                  dr.text((col*W+3,5),f"#{b+col+1} {title}",fill="black")
                  for row in range(5):
                      fp=f"{d}/frame_{row+1}.jpg"
                      if os.path.exists(fp):
                          im=ImageOps.fit(Image.open(fp).convert("RGB"),(W,H))
                          sh.paste(im,(col*W,30+row*H))
              sh.save(f"sheets/sheet_{b+1}_{b+len(batch)}.jpg",quality=82)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: finance-panthere-archived-visual
          path: |
            archive.json
            ranked.json
            corpus/
            sheets/
          retention-days: 3
          compression-level: 6

