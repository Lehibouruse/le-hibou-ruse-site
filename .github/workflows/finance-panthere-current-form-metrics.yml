name: Finance Panthere current form metrics

on:
  push:
    paths:
      - ".github/workflows/finance-panthere-current-form-metrics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install
        run: |
          pipx install yt-dlp
          pipx inject yt-dlp curl-cffi
          python3 -m pip install -q faster-whisper
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Analyze five public videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > analyze.py <<'PY'
          import subprocess,json,re,os
          from faster_whisper import WhisperModel
          ids=["7632441528434085153","7629795204467363104","7630036576214469921","7633139197016100129","7630587558539414816"]
          model=WhisperModel("small",device="cpu",compute_type="int8")
          rows=[]
          for rank,vid in enumerate(ids,1):
              url=f"https://www.tiktok.com/@financepanthere/video/{vid}"
              media=f"out/{rank:02d}_{vid}.mp4"
              cmd=["yt-dlp","--extractor-args","tiktok:api_hostname=api22-normal-c-useast1a.tiktokv.com",
                   "-f","worst[ext=mp4]/worst","--no-playlist","-o",media,url]
              p=subprocess.run(cmd,capture_output=True,text=True)
              if p.returncode!=0:
                  rows.append({"rank":rank,"id":vid,"error":p.stderr[-1000:]}); continue
              dur=float(subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1",media],capture_output=True,text=True).stdout.strip())
              segs,info=model.transcribe(media,language="fr",beam_size=3,vad_filter=True)
              texts=[]; nseg=0
              for s in segs:
                  t=s.text.strip()
                  if t: texts.append(t); nseg+=1
              full=" ".join(texts); words=len(full.split())
              counts={}
              cuts={}
              for thr in [0.08,0.15,0.25,0.35]:
                  filt=f"select='gt(scene,{thr})',showinfo"
                  q=subprocess.run(["ffmpeg","-hide_banner","-i",media,"-vf",filt,"-an","-f","null","-"],capture_output=True,text=True)
                  times=[float(x) for x in re.findall(r"pts_time:([0-9.]+)",q.stderr)]
                  counts[str(thr)]=len(times)
                  cuts[str(thr)]=times
              rows.append({"rank":rank,"id":vid,"duration":dur,"words":words,"wpm":words/(dur/60),"segments":nseg,"text":full,
                           "scene_counts":counts,"scene_times":cuts})
              os.remove(media)
          json.dump(rows,open("out/metrics.json","w"),ensure_ascii=False,indent=2)
          for r in rows:
              print({k:r.get(k) for k in ["rank","id","duration","words","wpm","scene_counts"]})
          PY
          python3 analyze.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: finance-panthere-current-form-metrics
          path: out/metrics.json
          retention-days: 3
