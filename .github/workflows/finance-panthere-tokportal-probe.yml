name: Finance Panthere TokPortal archive probe

on:
  push:
    paths:
      - ".github/workflows/finance-panthere-tokportal-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch TokPortal pages and inspect embedded data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for url in             "https://www.tokportal.com/tool/tiktok-profile-analytics-checker/financepanthere"             "https://www.tokportal.com/passport/financepanthere"; do
            name=$(echo "$url" | sed 's#[^A-Za-z0-9]#_#g')
            curl -L -sS --connect-timeout 8 --max-time 60 -A "Mozilla/5.0" "$url" -o "out/$name.html"
          done
          python3 - <<'PY'
          import glob,re,json,html,os
          for p in glob.glob("out/*.html"):
              s=open(p,encoding="utf-8",errors="ignore").read()
              print("\nFILE",os.path.basename(p),"BYTES",len(s))
              print("video ids",len(set(re.findall(r'\b\d{18,20}\b',s))))
              print("tiktok urls",len(set(re.findall(r'https?://[^"\']*tiktok[^"\']*',s,re.I))))
              for pat in ["__NEXT_DATA__","buildId","recentPosts","videos","posts","view_count","viewCount","videoId","aweme"]:
                  print(pat,s.find(pat))
              ids=list(dict.fromkeys(re.findall(r'\b\d{18,20}\b',s)))
              print("IDS",ids[:100])
              urls=list(dict.fromkeys(re.findall(r'https?://[^"\']+',s)))
              print("TIKTOK_URLS",[u[:300] for u in urls if "tiktok" in u.lower()][:50])
              # likely API/path strings around post/video keywords
              for m in re.finditer(r'(?:api|video|post|analytics)[^"\']{0,180}',s,re.I):
                  z=m.group(0)
                  if "financepanthere" in z.lower() or "video" in z.lower() or "post" in z.lower():
                      print("SNIP",z[:250])
          PY
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: finance-panthere-tokportal-probe
          path: out/
          retention-days: 3
