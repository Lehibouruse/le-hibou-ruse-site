name: Furet TikTok public probe

on:
  push:
    paths:
      - ".github/workflows/furet-tiktok-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public TikTok profile
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.tiktok.com/@lefutetfute"
          code=$(curl -L -sS --connect-timeout 5 --max-time 30             -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"             -H "Accept-Language: fr-FR,fr;q=0.9,en;q=0.8"             -o profile.html -w "%{http_code}" "$url" || true)
          echo "HTTP=$code BYTES=$(wc -c < profile.html 2>/dev/null || echo 0)"
          python3 - <<'PY'
          s=open("profile.html",encoding="utf-8",errors="ignore").read()
          for key in ["__UNIVERSAL_DATA_FOR_REHYDRATION__","SIGI_STATE","ItemModule","UserModule","webapp.user-detail","seo.abtest"]:
              print(key,s.find(key))
          print(s[:5000])
          PY
