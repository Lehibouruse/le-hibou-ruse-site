name: Furet TikTok public probe

on:
  push:
    paths:
      - ".github/workflows/furet-tiktok-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch TikWM user feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages
          cursor=0
          for page in 1 2 3 4 5 6; do
            url="https://tikwm.com/api/user/posts?unique_id=lefutetfute&count=34&cursor=$cursor"
            code=$(curl -L -sS --connect-timeout 5 --max-time 60 -o "pages/$page.json" -w "%{http_code}" "$url" || true)
            echo "PAGE=$page HTTP=$code BYTES=$(wc -c < pages/$page.json 2>/dev/null || echo 0)"
            python3 - "$page" <<'PY'
          import json,sys
          p=sys.argv[1]; d=json.load(open(f"pages/{p}.json"))
          print("code",d.get("code"),"msg",d.get("msg"))
          data=d.get("data") or {}
          vids=data.get("videos") or data.get("itemList") or []
          print("items",len(vids),"cursor",data.get("cursor"),"hasMore",data.get("hasMore") or data.get("has_more"))
          for x in vids[:3]:
              print(x.get("video_id") or x.get("id"),(x.get("title") or x.get("desc") or "")[:80],x.get("play_count"),x.get("digg_count"),x.get("comment_count"),x.get("share_count"))
          open("next_cursor.txt","w").write(str(data.get("cursor") or 0))
          open("hasmore.txt","w").write("1" if (data.get("hasMore") or data.get("has_more")) else "0")
          PY
            cursor=$(cat next_cursor.txt)
            [ "$(cat hasmore.txt)" = "1" ] || break
            sleep 1
          done
      - name: Build ranked manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json,glob
          allv={}
          for fn in glob.glob("pages/*.json"):
              d=json.load(open(fn)); data=d.get("data") or {}
              for x in (data.get("videos") or data.get("itemList") or []):
                  vid=str(x.get("video_id") or x.get("id") or "")
                  if vid: allv[vid]=x
          def n(x,*keys):
              for k in keys:
                  v=x.get(k)
                  if v is not None:
                      try:return int(v)
                      except: pass
              return 0
          rows=[]
          for vid,x in allv.items():
              rows.append({
                "id":vid,
                "desc":x.get("title") or x.get("desc") or "",
                "create_time":x.get("create_time"),
                "duration":x.get("duration") or (x.get("video") or {}).get("duration"),
                "play_count":n(x,"play_count","playCount"),
                "digg_count":n(x,"digg_count","diggCount"),
                "comment_count":n(x,"comment_count","commentCount"),
                "share_count":n(x,"share_count","shareCount"),
                "cover":x.get("cover") or x.get("origin_cover") or (x.get("video") or {}).get("cover"),
                "play":x.get("play") or (x.get("video") or {}).get("playAddr"),
                "music":x.get("music") or "",
                "music_info":x.get("music_info") or {}
              })
          rows.sort(key=lambda x:(x["play_count"],x["digg_count"],x["comment_count"]),reverse=True)
          out={"count":len(rows),"top50":rows[:50],"all":rows}
          open("ranked.json","w").write(json.dumps(out,ensure_ascii=False))
          print("TOTAL",len(rows))
          for i,x in enumerate(rows[:50],1):
              print(i,x["id"],x["play_count"],x["duration"],x["desc"][:100])
          PY
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ecureuil-furet-tiktok-corpus
          path: |
            pages/
            ranked.json
          retention-days: 3
