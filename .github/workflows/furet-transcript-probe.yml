name: Furet transcript probe

on:
  push:
    paths:
      - ".github/workflows/furet-transcript-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: pipx install yt-dlp
      - name: Probe top video captions
        shell: bash
        run: |
          set -euo pipefail
          ids=(7680439152348810528 7662815671595584800 7685271593848687904)
          for id in "${ids[@]}"; do
            url="https://www.tiktok.com/@lefutetfute/video/$id"
            echo "VIDEO=$id"
            yt-dlp -J --no-playlist "$url" > "$id.json" 2>"$id.err" || true
            python3 - "$id" <<'PY'
import json,sys,os
id=sys.argv[1]
p=f"{id}.json"
if not os.path.exists(p) or os.path.getsize(p)==0:
    print("NO_JSON"); print(open(f"{id}.err",errors="ignore").read()[-3000:]); raise SystemExit
d=json.load(open(p))
for k in ["title","description","duration","view_count","like_count","repost_count","comment_count","save_count","track","artists","language"]:
    print(k,repr(d.get(k)))
print("subtitles",json.dumps(d.get("subtitles"),ensure_ascii=False)[:12000])
print("automatic_captions",json.dumps(d.get("automatic_captions"),ensure_ascii=False)[:12000])
print("requested_subtitles",json.dumps(d.get("requested_subtitles"),ensure_ascii=False)[:4000])
PY
          done
