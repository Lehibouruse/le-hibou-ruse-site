name: Furet whisper transcript probe

on:
  push:
    paths:
      - ".github/workflows/furet-whisper-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install
        run: python3 -m pip install -q yt-dlp faster-whisper
      - name: Download and transcribe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transcripts
          cat > transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          import sys
          media=sys.argv[1]
          out=sys.argv[2]
          model=WhisperModel("small",device="cpu",compute_type="int8")
          segments,info=model.transcribe(media,language="fr",beam_size=5,vad_filter=True)
          with open(out,"w") as f:
              for s in segments:
                  line=f"[{s.start:.2f}-{s.end:.2f}] {s.text.strip()}"
                  print(line)
                  f.write(line+"\\n")
          print("language",info.language,"prob",info.language_probability)
          PY
          ids=(7680439152348810528 7662815671595584800 7685271593848687904)
          for id in "${ids[@]}"; do
            url="https://www.tiktok.com/@lefutetfute/video/$id"
            rm -f video.mp4
            yt-dlp --extractor-args "tiktok:api_hostname=api22-normal-c-useast1a.tiktokv.com" --no-playlist --quiet --no-warnings -f "worst[ext=mp4]/worst" -o video.mp4 "$url"
            python3 transcribe.py video.mp4 "transcripts/$id.txt"
          done
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: furet-whisper-probe
          path: transcripts/
          retention-days: 3
