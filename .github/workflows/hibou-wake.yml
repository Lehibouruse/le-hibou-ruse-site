name: Hibou Agent Wake

# Changes to this workflow self-test the wake path on main.
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hibou-wake.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify authentication and queue visibility without processing a Job
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: hibou-agent-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install worker dependencies
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || !inputs.dry_run }}
        run: npm ci
      - name: Ensure media runtime
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! command -v rsvg-convert >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg librsvg2-bin
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
          rsvg-convert --version
      - name: Wake scheduler and verify authentication
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "X-Hibou-Dry-Run: ${DRY_RUN}" \
            -H "Content-Type: application/json" \
            https://le-hibou-ruse-site.vercel.app/api/wake
      - name: Run bounded autonomous worker
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HIBOU_WORKER_URL: https://le-hibou-ruse-site.vercel.app/api/agent-worker
        run: node scripts/hibou-worker.mjs
