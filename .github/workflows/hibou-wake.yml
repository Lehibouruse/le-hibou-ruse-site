name: Hibou Agent Wake

# Core infrastructure changes self-test the wake path on main.
# Automatic paid-agent scheduling is intentionally disabled. Use workflow_dispatch
# when a manual wake is explicitly wanted.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hibou-wake.yml"
      - "scripts/hibou-worker.mjs"
      - "scripts/prepare-hibou-worker.mjs"
      - "app/api/wake/**"
      - "app/api/agent-worker/**"
      - "app/api/orchestrator/**"
      - "app/api/social/**"
      - "app/api/social-scheduler/**"
      - "app/api/book-scheduler/**"
      - "app/api/book-export/**"
      - "app/api/book-reconcile/**"
      - "app/api/commerce/**"
      - "lib/airtable.js"
      - "lib/book-renderer.mjs"
      - "lib/commerce.mjs"
      - "lib/agent-capabilities.mjs"
      - "lib/agent-runtime.mjs"
      - "lib/github-oidc.mjs"
      - "lib/hibou-agent.mjs"
      - "lib/job-eligibility.mjs"
      - "lib/social-gateway.mjs"
      - "lib/social-runtime.mjs"
  workflow_dispatch:
    inputs:
      test_bluesky:
        description: Test Bluesky authentication only, without processing jobs or publishing
        required: true
        type: boolean
        default: false
      dry_run:
        description: Verify authentication and queue visibility without processing a Job
        required: true
        type: boolean
        default: true
      export_book:
        description: Generate a versioned PDF artifact from the Airtable book
        required: true
        type: boolean
        default: false
      export_draft:
        description: Allow a partial draft export even if chapters are not ready for sale
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://le-hibou-ruse-site.vercel.app' }}

concurrency:
  group: hibou-agent-wake-${{ github.event_name == 'push' && 'self-test' || 'manual' }}
  cancel-in-progress: false

jobs:
  bluesky_connection:
    # The explicit commit marker also permits a one-off check through the GitHub
    # connector, which can merge changes but cannot dispatch workflows.
    if: (github.event_name == 'workflow_dispatch' && inputs.test_bluesky) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-bluesky]'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Test Bluesky server credentials without publishing
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_code=$(curl --silent --show-error --max-time 140 \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            --data '{"provider":"bluesky"}' \
            "${HIBOU_BASE_URL}/api/social/connection-test")
          printf 'bluesky_connection_http=%s\n' "$http_code"
          python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              data = json.load(source)
          results = data.get("results", [])
          safe_results = [{key: row.get(key) for key in ("provider", "ok", "state", "identity", "error")} for row in results]
          print(json.dumps({"ok": data.get("ok"), "results": safe_results, "safety": data.get("safety")}, ensure_ascii=False))
          assert data.get("ok") is True and len(results) == 1
          assert results[0].get("provider") == "bluesky" and results[0].get("ok") is True
          assert results[0].get("identity", {}).get("public_id") == "le-hibou-ruse.bsky.social"
          assert data.get("safety", {}).get("publication_triggered") is False
          PY
          test "$http_code" = "200"

  wake:
    if: (github.event_name != 'workflow_dispatch' || !inputs.test_bluesky) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[test-bluesky]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wake scheduler and inspect queue
        id: wake
        env:
          DRY_RUN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.export_book))) && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          # Non-destructive editorial reconciliation: it only updates metrics/QC for
          # chapters whose current V2B Jobs already cover the complete source range.
          reconciliation=$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            "${HIBOU_BASE_URL}/api/book-reconcile" 2>&1 || true)
          printf 'book_reconcile=%s\n' "$reconciliation"

          post_commerce_effect() {
            local label="$1"
            local path="$2"
            local response_file http_code curl_rc response
            response_file=$(mktemp)
            set +e
            http_code=$(curl --silent --show-error \
              -o "$response_file" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              "${HIBOU_BASE_URL}${path}")
            curl_rc=$?
            set -e
            response=$(cat "$response_file")
            rm -f "$response_file"
            printf '%s=%s\n' "$label" "$response"
            printf '%s_http=%s curl_rc=%s\n' "$label" "$http_code" "$curl_rc"
            if [ "$curl_rc" -ne 0 ]; then
              echo "${label} transport failure" >&2
              exit "$curl_rc"
            fi
            case "$http_code" in
              200|201|202|204|409|422) ;;
              *) echo "${label} HTTP failure: $http_code" >&2; exit 1 ;;
            esac
          }

          # Delivery/revocation are real external effects. Push self-tests and manual
          # dry-runs must never touch Digify even when pending commerce records exist.
          if [ "$DRY_RUN" = "true" ]; then
            printf 'delivery=%s\n' "skipped_dry_run"
            printf 'revocation=%s\n' "skipped_dry_run"
          else
            post_commerce_effect "delivery" "/api/commerce/delivery"
            post_commerce_effect "revocation" "/api/commerce/revoke"
          fi

          response_file=$(mktemp)
          set +e
          http_code=$(curl --silent --show-error \
            --retry 2 --retry-delay 1 --retry-max-time 30 \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "X-Hibou-Dry-Run: ${DRY_RUN}" \
            -H "Content-Type: application/json" \
            "${HIBOU_BASE_URL}/api/wake")
          curl_rc=$?
          set -e
          response=$(cat "$response_file")
          rm -f "$response_file"
          printf '%s\n' "$response"
          printf 'wake_http=%s curl_rc=%s\n' "$http_code" "$curl_rc"

          if [ "$curl_rc" -ne 0 ]; then
            echo "Wake transport failure" >&2
            exit "$curl_rc"
          fi
          case "$http_code" in
            200|201|202|204|409|422) ;;
            *) echo "Wake HTTP failure: $http_code" >&2; exit 1 ;;
          esac

          worker_required=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print("true" if d.get("reason") == "github_worker_required" else "false")' <<< "$response")
          action=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("action") or "")' <<< "$response")
          echo "worker_required=$worker_required" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Export private book source and render PDF
        id: book_export
        if: github.event_name == 'workflow_dispatch' && inputs.export_book
        env:
          DRAFT: ${{ inputs.export_draft && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"
          out="$RUNNER_TEMP/hibou-book"
          mkdir -p "$out"
          headers="$out/headers.txt"
          curl --fail-with-body --silent --show-error \
            -D "$headers" \
            -H "Authorization: Bearer ${token}" \
            -H "X-Hibou-Book-Draft: ${DRAFT}" \
            "${HIBOU_BASE_URL}/api/book-export" \
            -o "$out/book.html"
          edition=$(awk -F ': ' 'tolower($1)=="x-hibou-book-edition" {gsub("\r", "", $2); print $2}' "$headers" | tail -1)
          safe=$(printf '%s' "${edition:-draft}" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')
          [ -n "$safe" ] || safe="draft"
          html="$out/le-hibou-ruse-${safe}.html"
          pdf="$out/le-hibou-ruse-${safe}.pdf"
          mv "$out/book.html" "$html"
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$browser" ]; then
            echo "Aucun navigateur Chromium disponible sur le runner" >&2
            exit 1
          fi
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --print-to-pdf="$pdf" --no-pdf-header-footer "file://$html"
          test -s "$pdf"
          printf 'edition=%s\n' "$safe" >> "$GITHUB_OUTPUT"
          printf 'pdf=%s\n' "$pdf" >> "$GITHUB_OUTPUT"
          printf 'html=%s\n' "$html" >> "$GITHUB_OUTPUT"
          printf 'Generated %s (%s bytes)\n' "$pdf" "$(wc -c < "$pdf")"

      - name: Upload private book artifact
        if: github.event_name == 'workflow_dispatch' && inputs.export_book
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hibou-book-${{ steps.book_export.outputs.edition }}
          path: |
            ${{ steps.book_export.outputs.pdf }}
            ${{ steps.book_export.outputs.html }}
          if-no-files-found: error
          retention-days: 30

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.wake.outputs.worker_required == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.wake.outputs.worker_required == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Prepare worker server-tool relays
        if: steps.wake.outputs.worker_required == 'true'
        run: node scripts/prepare-hibou-worker.mjs

      - name: Install worker dependencies
        if: steps.wake.outputs.worker_required == 'true'
        run: npm ci

      - name: Ensure media runtime
        if: steps.wake.outputs.worker_required == 'true' && steps.wake.outputs.action == 'CREATE_VIDEO'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! command -v rsvg-convert >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg librsvg2-bin
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
          rsvg-convert --version

      - name: Run bounded autonomous worker
        if: steps.wake.outputs.worker_required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: HIBOU_WORKER_URL="${HIBOU_BASE_URL}/api/agent-worker" node scripts/hibou-worker.mjs
