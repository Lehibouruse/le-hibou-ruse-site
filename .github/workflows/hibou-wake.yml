name: Hibou Agent Wake

# Core infrastructure changes self-test the wake path on main.
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hibou-wake.yml"
      - "scripts/hibou-worker.mjs"
      - "scripts/prepare-hibou-worker.mjs"
      - "app/api/wake/**"
      - "app/api/agent-worker/**"
      - "app/api/orchestrator/**"
      - "app/api/social/**"
      - "app/api/social-scheduler/**"
      - "app/api/book-scheduler/**"
      - "app/api/book-export/**"
      - "app/api/commerce/**"
      - "lib/airtable.js"
      - "lib/book-renderer.mjs"
      - "lib/commerce.mjs"
      - "lib/agent-capabilities.mjs"
      - "lib/agent-runtime.mjs"
      - "lib/github-oidc.mjs"
      - "lib/hibou-agent.mjs"
      - "lib/job-eligibility.mjs"
      - "lib/social-gateway.mjs"
      - "lib/social-runtime.mjs"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify authentication and queue visibility without processing a Job
        required: true
        type: boolean
        default: true
      export_book:
        description: Generate a versioned PDF artifact from the Airtable book
        required: true
        type: boolean
        default: false
      export_draft:
        description: Allow a partial draft export even if chapters are not ready for sale
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  # A long business Job must never prevent an infrastructure push self-test.
  # Leases in Airtable still prevent two workers from owning the same Job.
  group: hibou-agent-wake-${{ github.event_name == 'push' && 'self-test' || 'scheduler' }}
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wake scheduler and inspect queue
        id: wake
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.export_book) && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          # E-book delivery and refund revocation are separate queues: external
          # commerce problems must never block the Core business worker.
          delivery=$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            https://le-hibou-ruse-site.vercel.app/api/commerce/delivery 2>&1 || true)
          printf 'delivery=%s\n' "$delivery"

          revocation=$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            https://le-hibou-ruse-site.vercel.app/api/commerce/revoke 2>&1 || true)
          printf 'revocation=%s\n' "$revocation"

          response=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "X-Hibou-Dry-Run: ${DRY_RUN}" \
            -H "Content-Type: application/json" \
            https://le-hibou-ruse-site.vercel.app/api/wake)
          printf '%s\n' "$response"
          worker_required=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print("true" if d.get("reason") == "github_worker_required" else "false")' <<< "$response")
          action=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("action") or "")' <<< "$response")
          echo "worker_required=$worker_required" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Export private book source and render PDF
        id: book_export
        if: github.event_name == 'workflow_dispatch' && inputs.export_book
        env:
          DRAFT: ${{ inputs.export_draft && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"
          out="$RUNNER_TEMP/hibou-book"
          mkdir -p "$out"
          headers="$out/headers.txt"
          curl --fail-with-body --silent --show-error \
            -D "$headers" \
            -H "Authorization: Bearer ${token}" \
            -H "X-Hibou-Book-Draft: ${DRAFT}" \
            https://le-hibou-ruse-site.vercel.app/api/book-export \
            -o "$out/book.html"
          edition=$(awk -F ': ' 'tolower($1)=="x-hibou-book-edition" {gsub("\r", "", $2); print $2}' "$headers" | tail -1)
          safe=$(printf '%s' "${edition:-draft}" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')
          [ -n "$safe" ] || safe="draft"
          html="$out/le-hibou-ruse-${safe}.html"
          pdf="$out/le-hibou-ruse-${safe}.pdf"
          mv "$out/book.html" "$html"
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$browser" ]; then
            echo "Aucun navigateur Chromium disponible sur le runner" >&2
            exit 1
          fi
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --print-to-pdf="$pdf" --no-pdf-header-footer "file://$html"
          test -s "$pdf"
          printf 'edition=%s\n' "$safe" >> "$GITHUB_OUTPUT"
          printf 'pdf=%s\n' "$pdf" >> "$GITHUB_OUTPUT"
          printf 'html=%s\n' "$html" >> "$GITHUB_OUTPUT"
          printf 'Generated %s (%s bytes)\n' "$pdf" "$(wc -c < "$pdf")"

      - name: Upload private book artifact
        if: github.event_name == 'workflow_dispatch' && inputs.export_book
        uses: actions/upload-artifact@v4
        with:
          name: hibou-book-${{ steps.book_export.outputs.edition }}
          path: |
            ${{ steps.book_export.outputs.pdf }}
            ${{ steps.book_export.outputs.html }}
          if-no-files-found: error
          retention-days: 30

      - uses: actions/checkout@v4
        if: steps.wake.outputs.worker_required == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.wake.outputs.worker_required == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Prepare worker server-tool relays
        if: steps.wake.outputs.worker_required == 'true'
        run: node scripts/prepare-hibou-worker.mjs

      - name: Install worker dependencies
        if: steps.wake.outputs.worker_required == 'true'
        run: npm ci

      - name: Ensure media runtime
        if: steps.wake.outputs.worker_required == 'true' && steps.wake.outputs.action == 'CREATE_VIDEO'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! command -v rsvg-convert >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg librsvg2-bin
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
          rsvg-convert --version

      - name: Run bounded autonomous worker
        if: steps.wake.outputs.worker_required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HIBOU_WORKER_URL: https://le-hibou-ruse-site.vercel.app/api/agent-worker
        run: node scripts/hibou-worker.mjs
