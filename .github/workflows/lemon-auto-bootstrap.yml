name: Hibou Lemon Auto Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - docs/.lemon-auto-bootstrap-v1

permissions:
  contents: read
  actions: write

jobs:
  dispatch-test-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue safe Lemon test bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Queueing full_bootstrap"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/lemon-commerce-test.yml/dispatches" \
            -d '{"ref":"main","inputs":{"action":"full_bootstrap"}}'
          echo "Queued one sequential test-only Lemon bootstrap: inspect -> checkout_test -> webhook_test."
