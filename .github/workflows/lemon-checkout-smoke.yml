name: Lemon Checkout Smoke

on:
  push:
    paths:
      - 'docs/.lemon-checkout-smoke'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-checkout-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Queue isolated Lemon checkout_test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${REPO}/actions/workflows/lemon-commerce-test.yml/dispatches"             -d '{"ref":"main","inputs":{"action":"checkout_test"}}'
          echo "Queued Lemon checkout_test through the canonical OIDC workflow."
