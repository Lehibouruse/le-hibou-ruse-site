name: Hibou Lemon Commerce Test

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Safe Lemon test action"
        required: true
        default: "inspect"
        type: choice
        options:
          - inspect
          - checkout_test
          - webhook_test
          - full_bootstrap

permissions:
  contents: read
  id-token: write

concurrency:
  group: hibou-lemon-commerce-test
  cancel-in-progress: false

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://le-hibou-ruse-site.vercel.app' }}

jobs:
  lemon-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run test-only Lemon bootstrap
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            inspect|checkout_test|webhook_test) actions=("$ACTION") ;;
            full_bootstrap) actions=(inspect checkout_test webhook_test) ;;
            *) echo "Unsupported action" >&2; exit 2 ;;
          esac

          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          for effective_action in "${actions[@]}"; do
            echo "Running Lemon test action: ${effective_action}"
            response=""
            http_code=""
            curl_rc=0
            for attempt in 1 2 3; do
              response_file=$(mktemp)
              set +e
              http_code=$(curl --silent --show-error \
                -o "$response_file" -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                --data "{\"action\":\"${effective_action}\"}" \
                "${HIBOU_BASE_URL}/api/commerce/lemon-bootstrap")
              curl_rc=$?
              set -e
              response=$(cat "$response_file")
              rm -f "$response_file"

              printf '%s\n' "$response"
              printf 'lemon_test_http=%s curl_rc=%s action=%s attempt=%s\n' "$http_code" "$curl_rc" "$effective_action" "$attempt"
              if [ "$curl_rc" -ne 0 ]; then
                echo "Lemon bootstrap transport failure" >&2
                exit "$curl_rc"
              fi
              if [ "$http_code" != "404" ]; then
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Lemon bootstrap returned 404; allowing brief deployment propagation before retry"
                sleep 15
              fi
            done

            if [ "$http_code" = "404" ]; then
              echo "Persistent 404 after deployment grace window: Lemon bootstrap route missing" >&2
              exit 1
            fi
            if [ "$http_code" != "200" ]; then
              echo "Lemon bootstrap HTTP failure: $http_code action=$effective_action" >&2
              exit 1
            fi
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("mode") == "test_only"; print("lemon_test_ok=true")' <<< "$response"
          done
