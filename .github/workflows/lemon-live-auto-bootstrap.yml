name: Hibou Lemon Live Auto Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - docs/.lemon-live-webhook-bootstrap-v1

permissions:
  contents: read
  actions: write

jobs:
  dispatch-live-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue safe Lemon live infrastructure bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/lemon-live-bootstrap.yml/dispatches" \
            -d '{"ref":"main","inputs":{"action":"full_live_infra"}}'
          echo "Queued inspect_live -> webhook_live. No live checkout or payment is created."
