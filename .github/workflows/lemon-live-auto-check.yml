name: Hibou Lemon Live Auto Check

on:
  push:
    branches:
      - main
    paths:
      - 'docs/.lemon-live-auto-check'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Queue Lemon full live infra verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${REPO}/actions/workflows/lemon-live-bootstrap.yml/dispatches"             -d '{"ref":"main","inputs":{"action":"full_live_infra"}}'
          echo "Queued full live Lemon infrastructure verification."
