name: Lemon Live Checkout Refresh

on:
  push:
    paths:
      - 'docs/.lemon-live-refresh'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-live-checkout-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Queue safe checkout_live refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/lemon-live-bootstrap.yml/dispatches" \
            -d '{"ref":"main","inputs":{"action":"checkout_live"}}'
          echo "Queued safe Lemon checkout_live refresh."
