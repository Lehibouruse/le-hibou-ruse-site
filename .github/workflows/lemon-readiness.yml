name: Lemon Readiness

on:
  push:
    paths:
      - '.github/lemon-readiness.trigger'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lemon-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Lemon readiness without side effects
        shell: bash
        env:
          HIBOU_BASE_URL: https://d4d5d6.com
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          response_file=$(mktemp)
          http_code=$(curl --silent --show-error             -o "$response_file" -w '%{http_code}'             -X POST             -H "Authorization: Bearer ${token}"             -H "Content-Type: application/json"             --data '{}'             "${HIBOU_BASE_URL}/api/commerce/lemon-readiness")

          echo "HTTP ${http_code}"
          cat "$response_file"
          echo
          test "$http_code" = "200"
          python3 - "$response_file" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get("ok") is True
          print("api_key_present=", data.get("api_key_present"))
          print("api_authenticated=", data.get("api_authenticated"))
          print("webhook_secret_present=", data.get("webhook_secret_present"))
          print("store_id=", data.get("store_id"))
          print("product_id=", data.get("product_id"))
          print("variant_id=", data.get("variant_id"))
          print("variant_price_cents=", data.get("variant_price_cents"))
          print("blockers=", ",".join(data.get("blockers") or []))
          PY
          rm -f "$response_file"
