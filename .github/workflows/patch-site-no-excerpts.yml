name: Patch site copy without excerpts
on:
  push:
    branches: [site-no-excerpts-checkout-minimal-2026-10-03]
    paths: [.github/workflows/patch-site-no-excerpts.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-no-excerpts-checkout-minimal-2026-10-03
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Marc's site corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('components/BookStore.js')
          s=p.read_text()
          s=s.replace("import { markdownToBookHtml } from '../lib/book-renderer.mjs';\n",'')
          s=s.replace("import { BookAction, BookContents, BookPreview, BookSignals, OfficialHibou } from './BookExperience';","import { BookAction, BookSignals, OfficialHibou } from './BookExperience';")
          s=s.replace('<a href="/guide#extrait">Un vrai montage</a>','<a href="/guide#exemple">Exemple holding</a>')
          start=s.index('function OfferBlock(')
          end=s.index('export default function BookStore', start)
          replacement=r'''const BOOK_TEASERS = [
            ['RÉMUNÉRATION', 'Jusqu’où peut-on légalement réduire l’impôt ?', 'Les cas où la qualification du revenu change fortement le résultat.'],
            ['SOCIÉTÉ', 'Faire sortir de la valeur autrement qu’en salaire', 'Salaire, dividendes, frais, actifs, droits, crédit : comparer les circuits.'],
            ['STRUCTURES', 'Association, fondation, coopérative : quand la structure change la donne', 'Flux, droits, gouvernance et financement ne fonctionnent plus de la même façon.'],
            ['IMMOBILIER', 'Qui détient quoi ? Et qui paie quoi ?', 'SCI, SCPI, usufruit, nue-propriété et démembrement.'],
            ['STATUTS', 'Revenus atypiques. Statuts particuliers. Règles différentes.', 'Quand votre situation sort du cas standard, la bonne qualification devient centrale.'],
            ['RÉALITÉ', 'Ce qui tient sur le papier… et dans les faits', 'Les montages séduisants ne valent que si la réalité suit.'],
          ];

          function BookTopics() {
            return <div className="store-topics" id="contenu"><p className="store-overline">QUELQUES MONTAGES COMPRIS DANS LE LIVRE</p><div className="store-topic-grid">{BOOK_TEASERS.map(([kicker,title,text], index) => <article className="store-topic-card" key={title}><div className="store-topic-meta"><span>{kicker}</span><span>{String(index + 1).padStart(2, '0')}</span></div><h3>{title}</h3><p>{text}</p></article>)}</div><p className="store-small store-topic-note">Une sélection seulement. Le site ne publie ni le sommaire complet ni le texte du livre.</p></div>;
          }

          function OfferBlock({ offer }) {
            return <section className="store-offer-section" id="offre"><div className="store-wrap store-offer-grid"><div><p className="store-overline">LE LIVRE DU HIBOU</p><h2>Les classiques ?<br/><em>Vous les connaissez déjà.</em></h2><p className="store-lead">Des montages atypiques, travaillés et expliqués avec des cas concrets. De l’optimisation assumée, pas un catalogue de placements.</p><div className="store-included"><p><span>01</span> Comprendre le montage et ce qu’il peut changer.</p><p><span>02</span> Voir les chiffres et les combinaisons.</p><p><span>03</span> Repérer le détail qui fait tenir — ou tomber — l’ensemble.</p></div><BookTopics/><details className="store-reading-order"><summary>Dois-je lire le livre dans l’ordre ?</summary><p>Non. Commencez par le sujet qui vous intéresse.</p></details></div><div className="store-offer-card"><span className="store-pill">GUIDE NUMÉRIQUE</span><h3>Le guide du Hibou Rusé</h3><p className="store-offer-price">{offer.priceLabel}</p><p className="store-price-line">Paiement unique.</p><BookAction href={offer.purchaseUrl || '/achat-guide'} purchase placement="offer">Acheter le livre</BookAction><p className="store-offer-status">Accès au lecteur personnel du Hibou après confirmation du paiement.</p><div className="store-edition-note" id="edition"><p>{offer.earlyAccess ? 'Édition en accès anticipé : les enrichissements du même guide seront ajoutés sans nouvel achat.' : 'Vous achetez l’édition disponible à la date de votre commande.'}</p></div></div></div></section>;
          }

          '''
          s=s[:start]+replacement+s[end:]
          s=s.replace("  const sample = offer.samples.find(item => item.number === 21);\n  const previewSamples = offer.samples.map(({ markdown, ...item }) => item);\n",'')
          s=s.replace('data-store-version="2026-10-03-marc"','data-store-version="2026-10-03-no-excerpts"')
          s=s.replace('href="#extrait" secondary placement="hero-excerpt">Voir un vrai montage','href="#exemple" secondary placement="hero-example">Voir l’exemple holding')
          pattern=re.compile(r'''    <section className="store-example-section" id="extrait">.*?</section>\n    <OfferBlock offer=\{offer\} guide=\{guide\} previewSamples=\{previewSamples\}/>''',re.S)
          repl='''    <section className="store-example-section" id="exemple"><div className="store-wrap"><div className="store-section-heading"><p className="store-overline">HOLDING + FINANCEMENT PERSONNEL</p><h2>Votre argent peut travailler.<br/><em>Sans tout distribuer.</em></h2><p>D’abord capitaliser dans la holding. Ensuite, étudier le nantissement de vos titres personnels pour emprunter.</p></div><HoldingLombard/></div></section>
            <OfferBlock offer={offer}/>'''
          s,n=pattern.subn(repl,s,count=1)
          assert n==1
          p.write_text(s)

          p=Path('components/book-store-voice.css')
          css=p.read_text()
          css += '\n.store-topics{margin-top:27px;padding-top:24px;border-top:1px solid #dbe7d036}.store-topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.store-topic-card{border:1px solid #dbe7d030;background:#ffffff0a;border-radius:10px;padding:18px;min-height:155px}.store-topic-meta{display:flex;justify-content:space-between;gap:14px;font-size:9px;letter-spacing:.12em;color:#dac17f;font-weight:800}.store-topic-card h3{font-family:Playfair Display,Georgia,serif;font-size:21px;line-height:1.22;margin:14px 0 10px;color:#fff9ed}.store-topic-card p{font-size:12px;line-height:1.65;color:#d8e1d4;margin:0}.store-topic-note{color:#c9d5c4!important;margin-top:14px}@media(max-width:740px){.store-topic-grid{grid-template-columns:1fr}.store-topic-card{min-height:0}}\n'
          p.write_text(css)

          p=Path('docs/SITE_EDITORIAL_DIRECTION.md')
          s=p.read_text()
          s += '\n\nDécision complémentaire du 03/10/2026 : ne publier sur le site ni extrait réel, ni passage du livre, ni sommaire exhaustif. Montrer seulement une sélection courte de thèmes sous forme d’accroches. L’exemple holding reste un exemple autonome, pas un extrait revendiqué du livre.\n'
          p.write_text(s)

          p=Path('tests/digital-supply-consent.test.mjs')
          s=p.read_text()
          s=s.replace("  assert.match(store, /offer\\.ready \\? <BookAction href=\\{offer\\.purchaseUrl\\}/);","  assert.match(store, /offer\\.purchaseUrl \\|\\| '\\/achat-guide'/);")
          p.write_text(s)

          p=Path('tests/legal-launch.test.mjs')
          s=p.read_text().replace('assert.match(storefront, /accès anticipé et incomplète/);','assert.match(storefront, /Édition en accès anticipé/);')
          p.write_text(s)

          p=Path('tests/site-editorial-direction.test.mjs')
          s=p.read_text().replace("  assert.match(store, /accès anticipé et incomplète/);","  assert.match(store, /Édition en accès anticipé/);")
          marker="test('no launch waitlist"
          extra="""test('no real book excerpt or full contents are published', () => {
            assert.doesNotMatch(store, /markdownToBookHtml|BookPreview|BookContents|EXTRAIT DU LIVRE|Lire l’extrait|Ouvrez un vrai passage|Explorer le sommaire/);
            assert.match(store, /QUELQUES MONTAGES COMPRIS DANS LE LIVRE/);
            assert.match(store, /Le site ne publie ni le sommaire complet ni le texte du livre/);
          });

          """
          if "no real book excerpt or full contents" not in s:
            s=s.replace(marker,extra+marker,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Commit
        run: |
          git rm .github/workflows/patch-site-no-excerpts.yml
          git add components/BookStore.js components/book-store-voice.css docs/SITE_EDITORIAL_DIRECTION.md tests/digital-supply-consent.test.mjs tests/legal-launch.test.mjs tests/site-editorial-direction.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'site: remove book excerpts and full contents'
          git push origin HEAD:site-no-excerpts-checkout-minimal-2026-10-03
