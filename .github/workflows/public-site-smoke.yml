name: Hibou Public Site Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/site-origin.mjs'
      - 'proxy.js'
      - 'vercel.json'
      - 'public/hibou-monocle.webp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hibou-public-site-smoke
  cancel-in-progress: true

jobs:
  public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify active public origin
        shell: bash
        env:
          SITE: https://le-hibou-ruse-site.vercel.app
        run: |
          set -euo pipefail

          check_url() {
            url="$1"
            expected="$2"
            for attempt in $(seq 1 24); do
              headers=$(mktemp)
              body=$(mktemp)
              code=$(curl --location --silent --show-error                 --connect-timeout 10 --max-time 20                 -D "$headers" -o "$body" -w '%{http_code}'                 "$url" || true)

              if [ "$code" = "200" ] && grep -Fiq "$expected" "$body"; then
                if grep -Eiq '^x-robots-tag:.*noindex' "$headers"; then
                  echo "Public URL answers 200 but sends X-Robots-Tag noindex: $url" >&2
                  cat "$headers"
                  rm -f "$headers" "$body"
                  return 1
                fi
                echo "PASS $url (HTTP 200, public content found)"
                rm -f "$headers" "$body"
                return 0
              fi

              echo "Waiting for public deployment: $url -> HTTP $code (attempt $attempt/24)"
              rm -f "$headers" "$body"
              sleep 10
            done
            echo "Public accessibility failed for $url" >&2
            return 1
          }

          check_url "$SITE/" "Le Hibou"
          check_url "$SITE/robots.txt" "User-agent"
          check_url "$SITE/sitemap.xml" "<urlset"

          homepage=$(mktemp)
          curl --location --silent --show-error --connect-timeout 10 --max-time 20 "$SITE/" -o "$homepage"
          if ! grep -Fq 'https://le-hibou-ruse-site.vercel.app/' "$homepage"; then
            echo "Active canonical origin not found in rendered homepage metadata." >&2
            rm -f "$homepage"
            exit 1
          fi
          rm -f "$homepage"

          sitemap=$(mktemp)
          curl --location --silent --show-error --connect-timeout 10 --max-time 20 "$SITE/sitemap.xml" -o "$sitemap"
          if ! grep -Fq 'https://le-hibou-ruse-site.vercel.app/' "$sitemap"; then
            echo "Active origin missing from sitemap." >&2
            cat "$sitemap"
            rm -f "$sitemap"
            exit 1
          fi
          rm -f "$sitemap"

          image_headers=$(mktemp)
          image_body=$(mktemp)
          image_code=$(curl --silent --show-error --connect-timeout 10 --max-time 20 -D "$image_headers" -o "$image_body" -w '%{http_code}' "$SITE/hibou-monocle.webp" || true)
          if [ "$image_code" != "200" ] || ! grep -Eiq '^content-type: *image/webp' "$image_headers"; then
            echo "Hibou monocle asset is not publicly served as WebP." >&2
            cat "$image_headers"
            rm -f "$image_headers" "$image_body"
            exit 1
          fi
          if [ ! -s "$image_body" ]; then
            echo "Hibou monocle asset is empty." >&2
            rm -f "$image_headers" "$image_body"
            exit 1
          fi
          echo "PASS $SITE/hibou-monocle.webp (HTTP 200, image/webp)"
          rm -f "$image_headers" "$image_body"

          echo "Active public origin is reachable and indexable."
