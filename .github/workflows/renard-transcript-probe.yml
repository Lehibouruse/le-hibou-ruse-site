name: Renard transcript probe

on:
  push:
    paths:
      - ".github/workflows/renard-transcript-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe transcript endpoints
        shell: bash
        run: |
          set -euo pipefail
          ids=(bkF_sZgBRsU KQxjChS1p6s CbFERLNN8AU)
          for id in "${ids[@]}"; do
            echo "VIDEO=$id"
            for base in               "https://youtube-transcript.ai/transcript/$id.txt"               "https://youtube-transcript.ai/transcript/$id.txt?lang=fr"; do
              code=$(curl -A "Mozilla/5.0" -L -sS --connect-timeout 5 --max-time 90 -o out.txt -w "%{http_code}" "$base" || true)
              bytes=$(wc -c < out.txt 2>/dev/null || echo 0)
              echo "HTTP=$code BYTES=$bytes URL=$base"
              head -c 8000 out.txt 2>/dev/null || true
              echo
              echo "-----"
            done
            echo "======"
          done
