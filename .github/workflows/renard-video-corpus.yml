name: Renard video corpus

on:
  push:
    paths:
      - ".github/workflows/renard-video-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch ranked dataset
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://d4d5d6.com/api/competitor-renard-youtube?target=renard_finance" -o dataset.json
          python3 - <<'PY'
          import json
          d=json.load(open("dataset.json"))
          assert d.get("ok") is True
          vids=d.get("next50",[])
          assert len(vids) >= 50, len(vids)
          with open("manifest.tsv","w") as f:
              f.write("rank\tid\tviews\tduration\ttitle\turl\n")
              for i,v in enumerate(vids[:50],51):
                  title=(v.get("title") or "").replace("\t"," ").replace("\n"," ")
                  f.write(f'{i}\t{v.get("id","")}\t{v.get("viewCount",0)}\t{v.get("durationSeconds","")}\t{title}\t{v.get("url","")}\n')
          PY

      - name: Fetch temporal YouTube thumbnails
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visuals
          tail -n +2 manifest.tsv | while IFS=$'\t' read -r rank id views duration title url; do
            dir=$(printf "visuals/%02d_%s" "$rank" "$id")
            mkdir -p "$dir"
            for name in maxresdefault hqdefault 0 1 2 3; do
              curl -L -sS --fail --connect-timeout 2 --max-time 5                 "https://i.ytimg.com/vi/$id/$name.jpg"                 -o "$dir/$name.jpg" || rm -f "$dir/$name.jpg"
            done
          done
          find visuals -type f -printf '%p\t%s\n' | sort > visual_files.tsv
          echo "images=$(find visuals -type f -name '*.jpg' | wc -l)"
          echo "videos_with_images=$(find visuals -mindepth 1 -maxdepth 1 -type d | wc -l)"

      - name: Upload visual corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: renard-top50-visual-corpus
          path: |
            dataset.json
            manifest.tsv
            visual_files.tsv
            visuals/
          retention-days: 3
          compression-level: 6
