name: Renard video corpus

on:
  push:
    paths:
      - ".github/workflows/renard-video-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install downloader
        run: |
          python3 -m pip install --upgrade yt-dlp

      - name: Fetch ranked dataset
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://d4d5d6.com/api/competitor-renard-youtube?target=renard_finance" -o dataset.json
          python3 - <<'PY'
          import json
          d=json.load(open("dataset.json"))
          assert d.get("ok") is True
          vids=d.get("top50",[])
          assert len(vids) >= 50, len(vids)
          with open("urls.txt","w") as f:
              for v in vids[:50]:
                  f.write(v["url"]+"\n")
          with open("manifest.tsv","w") as f:
              f.write("rank\tid\tviews\tduration\ttitle\turl\n")
              for i,v in enumerate(vids[:50],1):
                  title=(v.get("title") or "").replace("\t"," ").replace("\n"," ")
                  f.write(f'{i}\t{v.get("id","")}\t{v.get("viewCount",0)}\t{v.get("durationSeconds","")}\t{title}\t{v.get("url","")}\n')
          print("videos",len(vids[:50]))
          PY

      - name: Download 50 public Shorts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p videos
          yt-dlp             --ignore-errors             --no-playlist             --restrict-filenames             --max-filesize 20M             -f "b[height<=360]/bv*[height<=360]+ba/b[height<=480]/b"             --merge-output-format mp4             -o "videos/%(id)s.%(ext)s"             -a urls.txt
          echo "downloaded=$(find videos -type f | wc -l)"
          find videos -type f -maxdepth 1 -printf '%f %s\n' | sort > downloaded_files.txt
          cat downloaded_files.txt

      - name: Create contact-sheet source frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frames
          for f in videos/*; do
            [ -f "$f" ] || continue
            id=$(basename "$f" | cut -d. -f1)
            mkdir -p "frames/$id"
            ffmpeg -hide_banner -loglevel error -i "$f" -vf "fps=1/4,scale=180:-1" -q:v 5 "frames/$id/%03d.jpg" || true
          done

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: renard-top50-corpus
          path: |
            dataset.json
            manifest.tsv
            downloaded_files.txt
            videos/
            frames/
          retention-days: 3
          compression-level: 6
