name: Hibou Weekly Security Audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hibou-weekly-security-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static secret and unsafe-code self-check
        run: npm run security:self-check
      - name: Strict API surface audit
        run: npm run security:api-surface:strict
      - name: GitHub Actions pinning inventory
        run: node scripts/security-action-pinning.mjs
      - name: Backup plan remains dry-run safe
        run: npm run backup:plan
