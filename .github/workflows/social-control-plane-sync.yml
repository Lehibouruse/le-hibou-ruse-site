name: Hibou Social Control Plane Sync

on:
  schedule:
    - cron: "43 */2 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://le-hibou-ruse-site.vercel.app' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync authorization state to Airtable
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          response=""
          http_code=""
          curl_rc=0
          for attempt in 1 2 3; do
            response_file=$(mktemp)
            set +e
            http_code=$(curl --silent --show-error \
              -o "$response_file" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              --data '{"action":"sync_airtable"}' \
              "${HIBOU_BASE_URL}/api/social/control-plane")
            curl_rc=$?
            set -e
            response=$(cat "$response_file")
            rm -f "$response_file"
            echo "$response"
            printf 'social_control_plane_http=%s curl_rc=%s attempt=%s\n' "$http_code" "$curl_rc" "$attempt"

            if [ "$curl_rc" -ne 0 ]; then
              echo "Social control plane transport failure" >&2
              exit "$curl_rc"
            fi
            if [ "$http_code" != "404" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Social control plane returned 404; allowing brief deployment propagation before retry"
              sleep 15
            fi
          done

          if [ "$http_code" = "404" ]; then
            echo "Persistent 404 after deployment grace window: social control plane route missing" >&2
            exit 1
          fi
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Social control plane sync failed: HTTP $http_code" >&2
            exit 1
          fi

          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; s=d.get("summary",{}); print("oauth_ready=%s external_blockers=%s metricool=%s" % (s.get("ready_for_human_approval"), s.get("exact_external_blockers"), s.get("metricool_verified")))' <<< "$response"
