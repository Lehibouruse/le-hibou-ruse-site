name: Social direct API phase 2 Pinterest

on:
  push:
    branches:
      - hibou-social-direct-api-20260915
    paths:
      - .github/workflows/social-direct-phase2-pinterest.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hibou-social-direct-api-20260915
          fetch-depth: 0

      - name: Add Pinterest OAuth, encrypted credentials and native publishing
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, got {count}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          # Runtime provider registry.
          replace_once(
              "lib/social-runtime.mjs",
              'export const SOCIAL_PROVIDERS = ["youtube", "instagram", "facebook", "tiktok", "linkedin", "threads", "x", "snapchat"];',
              'export const SOCIAL_PROVIDERS = ["youtube", "instagram", "facebook", "tiktok", "linkedin", "threads", "pinterest", "x", "snapchat"];'
          )

          # Encrypted credential runtime + refresh token support.
          replace_once(
              "lib/social-credentials-runtime.mjs",
              'const NETWORKS = ["youtube", "instagram", "facebook", "tiktok", "linkedin", "threads", "x", "snapchat"];',
              'const NETWORKS = ["youtube", "instagram", "facebook", "tiktok", "linkedin", "threads", "pinterest", "x", "snapchat"];'
          )
          replace_once(
              "lib/social-credentials-runtime.mjs",
              '  threads: ["THREADS_ACCESS_TOKEN", "THREADS_REFRESH_TOKEN", "THREADS_USER_ID"],\n  x: ["X_ACCESS_TOKEN", "X_REFRESH_TOKEN", "X_USER_ID"],',
              '  threads: ["THREADS_ACCESS_TOKEN", "THREADS_REFRESH_TOKEN", "THREADS_USER_ID"],\n  pinterest: ["PINTEREST_ACCESS_TOKEN", "PINTEREST_REFRESH_TOKEN", "PINTEREST_USER_ID", "PINTEREST_USERNAME"],\n  x: ["X_ACCESS_TOKEN", "X_REFRESH_TOKEN", "X_USER_ID"],'
          )
          replace_once(
              "lib/social-credentials-runtime.mjs",
              '  if (["youtube", "tiktok", "linkedin", "threads", "x"].includes(value)) return value;',
              '  if (["youtube", "tiktok", "linkedin", "threads", "pinterest", "x"].includes(value)) return value;'
          )
          replace_once(
              "lib/social-credentials-runtime.mjs",
              '  if (provider === "x") {\n    if (!clean(current.X_REFRESH_TOKEN)) return markNeedsReauth(provider, credential, "X refresh token absent; offline.access requis", baseEnv);',
              '  if (provider === "pinterest") {\n    if (!clean(current.PINTEREST_REFRESH_TOKEN)) return markNeedsReauth(provider, credential, "Pinterest refresh token absent", baseEnv);\n    const clientId = clean(baseEnv.PINTEREST_APP_ID);\n    const clientSecret = clean(baseEnv.PINTEREST_APP_SECRET);\n    if (!clientId || !clientSecret) return markNeedsReauth(provider, credential, "Pinterest client credentials absents", baseEnv);\n    const headers = { Authorization: `Basic ${Buffer.from(`${clientId}:${clientSecret}`).toString("base64")}` };\n    const token = await tokenForm("https://api.pinterest.com/v5/oauth/token", {\n      grant_type: "refresh_token",\n      refresh_token: current.PINTEREST_REFRESH_TOKEN,\n    }, headers);\n    return persistRefreshed(provider, credential, {\n      PINTEREST_ACCESS_TOKEN: token.access_token,\n      PINTEREST_REFRESH_TOKEN: token.refresh_token || current.PINTEREST_REFRESH_TOKEN,\n      PINTEREST_USER_ID: current.PINTEREST_USER_ID || "",\n      PINTEREST_USERNAME: current.PINTEREST_USERNAME || "",\n    }, token, baseEnv);\n  }\n\n  if (provider === "x") {\n    if (!clean(current.X_REFRESH_TOKEN)) return markNeedsReauth(provider, credential, "X refresh token absent; offline.access requis", baseEnv);'
          )

          # OAuth app registration and exchange.
          replace_once(
              "lib/social-oauth.mjs",
              'const SUPPORTED = ["youtube", "tiktok", "meta", "linkedin", "x", "threads"];',
              'const SUPPORTED = ["youtube", "tiktok", "meta", "linkedin", "pinterest", "x", "threads"];'
          )
          replace_once(
              "lib/social-oauth.mjs",
              '  if (provider === "x") return {\n    provider,',
              '  if (provider === "pinterest") return {\n    provider,\n    clientId: required(env.PINTEREST_APP_ID, "PINTEREST_APP_ID"),\n    clientSecret: required(env.PINTEREST_APP_SECRET, "PINTEREST_APP_SECRET"),\n    authorizeUrl: "https://www.pinterest.com/oauth/",\n    tokenUrl: "https://api.pinterest.com/v5/oauth/token",\n    scopes: clean(env.PINTEREST_OAUTH_SCOPES) || "boards:read,boards:write,pins:read,pins:write,user_accounts:read",\n  };\n  if (provider === "x") return {\n    provider,'
          )
          replace_once(
              "lib/social-oauth.mjs",
              'async function exchangeX(cfg, code, state, env) {',
              'async function exchangePinterest(cfg, code, state, env) {\n  const headers = { Authorization: `Basic ${Buffer.from(`${cfg.clientId}:${cfg.clientSecret}`).toString("base64")}` };\n  const token = await formPost(cfg.tokenUrl, {\n    grant_type: "authorization_code", code, redirect_uri: redirectUri(cfg.provider, env),\n  }, headers);\n  const profile = await jsonGet("https://api.pinterest.com/v5/user_account", token.access_token).catch(() => ({}));\n  return {\n    payload: { env: {\n      PINTEREST_ACCESS_TOKEN: token.access_token,\n      PINTEREST_REFRESH_TOKEN: token.refresh_token || "",\n      PINTEREST_USER_ID: profile.id || "",\n      PINTEREST_USERNAME: profile.username || "",\n    }, profile },\n    scopes: token.scope || cfg.scopes,\n    expiresAt: nowIsoPlus(token.expires_in),\n  };\n}\n\nasync function exchangeX(cfg, code, state, env) {'
          )
          replace_once(
              "lib/social-oauth.mjs",
              '  else if (provider === "linkedin") result = await exchangeLinkedIn(cfg, code, state, env);\n  else if (provider === "x") result = await exchangeX(cfg, code, state, env);',
              '  else if (provider === "linkedin") result = await exchangeLinkedIn(cfg, code, state, env);\n  else if (provider === "pinterest") result = await exchangePinterest(cfg, code, state, env);\n  else if (provider === "x") result = await exchangeX(cfg, code, state, env);'
          )

          # Direct gateway: sandbox by default, image + video Pins, explicit board target.
          replace_once(
              "lib/social-gateway.mjs",
              'const PROVIDERS = ["youtube", "instagram", "facebook", "tiktok", "linkedin", "threads", "x", "snapchat"];',
              'const PROVIDERS = ["youtube", "instagram", "facebook", "tiktok", "linkedin", "threads", "pinterest", "x", "snapchat"];'
          )
          replace_once(
              "lib/social-gateway.mjs",
              '  if (provider === "x") return Boolean(clean(env.X_ACCESS_TOKEN));\n  return false;',
              '  if (provider === "pinterest") return hasAll(env, ["PINTEREST_ACCESS_TOKEN", "PINTEREST_BOARD_ID"]);\n  if (provider === "x") return Boolean(clean(env.X_ACCESS_TOKEN));\n  return false;'
          )
          replace_once(
              "lib/social-gateway.mjs",
              '  } else if (provider === "x") {\n    need("X_ACCESS_TOKEN");',
              '  } else if (provider === "pinterest") {\n    need("PINTEREST_ACCESS_TOKEN"); need("PINTEREST_BOARD_ID");\n  } else if (provider === "x") {\n    need("X_ACCESS_TOKEN");'
          )
          replace_once(
              "lib/social-gateway.mjs",
              'function directCapabilities(provider) {\n  if (["youtube", "instagram", "facebook", "tiktok", "threads", "linkedin", "x"].includes(provider)) return ["video_native"];\n  return [];\n}',
              'function directCapabilities(provider) {\n  if (provider === "pinterest") return ["image_native", "video_native"];\n  if (["youtube", "instagram", "facebook", "tiktok", "threads", "linkedin", "x"].includes(provider)) return ["video_native"];\n  return [];\n}'
          )
          replace_once(
              "lib/social-gateway.mjs",
              'async function dispatchDirect(provider, payload, env) {\n  if (provider === "tiktok") return dispatchTikTok(payload, env);',
              'function pinterestBase(env) {\n  return flag(env.PINTEREST_SANDBOX, true) ? "https://api-sandbox.pinterest.com/v5" : "https://api.pinterest.com/v5";\n}\n\nfunction pinterestMediaKind(payload) {\n  const explicit = clean(payload.metadata?.media_type).toLowerCase();\n  if (["image", "video"].includes(explicit)) return explicit;\n  try {\n    const path = new URL(payload.media_url).pathname.toLowerCase();\n    if (/\\.(png|jpe?g|webp|gif)$/.test(path)) return "image";\n  } catch {}\n  return "video";\n}\n\nasync function waitPinterestMedia(base, mediaId, headers, attempts = 30) {\n  for (let attempt = 0; attempt < attempts; attempt += 1) {\n    const state = await getJson(`${base}/media/${encodeURIComponent(mediaId)}`, headers);\n    const status = clean(state.status || state.media_status).toLowerCase();\n    if (["succeeded", "success", "ready"].includes(status)) return state;\n    if (["failed", "error"].includes(status)) throw new Error(`Pinterest media ${status}`);\n    await new Promise((resolve) => setTimeout(resolve, 2000));\n  }\n  throw new Error("Pinterest media toujours en traitement");\n}\n\nasync function dispatchPinterest(payload, env) {\n  const token = clean(env.PINTEREST_ACCESS_TOKEN);\n  const boardId = clean(payload.metadata?.board_id) || clean(env.PINTEREST_BOARD_ID);\n  if (!token) throw new Error("Pinterest access token absent");\n  if (!boardId) throw new Error("Pinterest board_id absent");\n  const sandbox = flag(env.PINTEREST_SANDBOX, true);\n  const base = pinterestBase(env);\n  const headers = { Authorization: `Bearer ${token}` };\n  const common = {\n    board_id: boardId,\n    title: (clean(payload.title) || "Le Hibou Rusé").slice(0, 100),\n    description: clean(payload.caption).slice(0, 800),\n    ...(clean(payload.metadata?.link) ? { link: clean(payload.metadata.link) } : {}),\n  };\n  let created;\n  if (pinterestMediaKind(payload) === "image") {\n    created = (await postJson(`${base}/pins`, {\n      ...common,\n      media_source: { source_type: "image_url", url: assertMediaUrl(payload.media_url) },\n    }, headers)).data;\n  } else {\n    const coverImageUrl = clean(payload.metadata?.cover_image_url);\n    if (!coverImageUrl) throw new Error("Pinterest vidéo requiert metadata.cover_image_url");\n    const media = await fetchMedia(payload.media_url);\n    const registered = (await postJson(`${base}/media`, { media_type: "video" }, headers)).data;\n    const mediaId = clean(registered.media_id || registered.id);\n    const uploadUrl = clean(registered.upload_url);\n    const uploadParameters = registered.upload_parameters && typeof registered.upload_parameters === "object" ? registered.upload_parameters : {};\n    if (!mediaId || !uploadUrl) throw new Error("Pinterest media registration incomplète");\n    const form = new FormData();\n    for (const [key, value] of Object.entries(uploadParameters)) form.append(key, String(value));\n    form.append("file", new Blob([media.bytes], { type: media.contentType || "video/mp4" }), "hibou-pinterest.mp4");\n    const upload = await fetch(uploadUrl, { method: "POST", body: form, cache: "no-store" });\n    if (!upload.ok) throw new Error(`Pinterest media upload ${upload.status}: ${(await upload.text()).slice(0, 500)}`);\n    await waitPinterestMedia(base, mediaId, headers);\n    created = (await postJson(`${base}/pins`, {\n      ...common,\n      media_source: { source_type: "video_id", media_id: mediaId, cover_image_url: assertMediaUrl(coverImageUrl) },\n    }, headers)).data;\n  }\n  const pinId = clean(created.id);\n  if (!pinId) throw new Error("Pinterest n'a pas renvoyé de Pin id");\n  return {\n    provider: "pinterest", pin_id: pinId, sandbox,\n    url: sandbox ? "" : `https://www.pinterest.com/pin/${encodeURIComponent(pinId)}/`,\n  };\n}\n\nasync function dispatchDirect(provider, payload, env) {\n  if (provider === "tiktok") return dispatchTikTok(payload, env);'
          )
          replace_once(
              "lib/social-gateway.mjs",
              '  if (provider === "youtube") return dispatchYouTube(payload, env);\n  if (provider === "x") return dispatchX(payload, env);',
              '  if (provider === "youtube") return dispatchYouTube(payload, env);\n  if (provider === "pinterest") return dispatchPinterest(payload, env);\n  if (provider === "x") return dispatchX(payload, env);'
          )

          # Persist native Pin identifiers on Content Pipeline.
          replace_once(
              "lib/social-publication.mjs",
              '  threads: { id: "ID Threads", url: "URL Threads" },\n  snapchat: { id: "ID Snapchat", url: "URL Snapchat" },',
              '  threads: { id: "ID Threads", url: "URL Threads" },\n  pinterest: { id: "ID Pinterest", url: "URL Pinterest" },\n  snapchat: { id: "ID Snapchat", url: "URL Snapchat" },'
          )
          replace_once(
              "lib/social-publication.mjs",
              '    threads: result.thread_id,\n    snapchat: result.post_id || result.media_id,',
              '    threads: result.thread_id,\n    pinterest: result.pin_id,\n    snapchat: result.post_id || result.media_id,'
          )
          replace_once(
              "lib/social-publication.mjs",
              '    if (provider === "linkedin") url = `https://www.linkedin.com/feed/update/${encodeURIComponent(id)}`;',
              '    if (provider === "linkedin") url = `https://www.linkedin.com/feed/update/${encodeURIComponent(id)}`;\n    if (provider === "pinterest") url = `https://www.pinterest.com/pin/${encodeURIComponent(id)}/`;'
          )

          # Core dry-run tool recognizes Pinterest.
          replace_once(
              "lib/agent-capabilities.mjs",
              '    provider: str("youtube, instagram, facebook, tiktok, linkedin, threads, x ou snapchat"),',
              '    provider: str("youtube, instagram, facebook, tiktok, linkedin, threads, pinterest, x ou snapchat"),'
          )

          # Admin OAuth setup UI and live callback origin display.
          replace_once(
              "app/admin/social/route.js",
              '  x: {\n    label: "X",',
              '  pinterest: {\n    label: "Pinterest",\n    portal: "https://developers.pinterest.com/apps/",\n    note: "Créer l’app Pinterest, demander Trial/Standard access, déclarer le callback et utiliser le Sandbox pour les premiers tests.",\n  },\n  x: {\n    label: "X",'
          )
          replace_once(
              "app/admin/social/route.js",
              '  const connectedCount = readiness.filter((provider) => credentials.find((item) => item.provider === provider.provider)?.status === "Connected").length;\n  const appReadyCount = readiness.filter((provider) => provider.ready).length;\n  const html =',
              '  const connectedCount = readiness.filter((provider) => credentials.find((item) => item.provider === provider.provider)?.status === "Connected").length;\n  const appReadyCount = readiness.filter((provider) => provider.ready).length;\n  let callbackOrigin = "non configuré";\n  try { callbackOrigin = new URL(readiness[0]?.redirect_uri || "").origin; } catch {}\n  const html ='
          )
          replace_once(
              "app/admin/social/route.js",
              '<span class="pill">Domaine callback : <strong>d4d5d6.com</strong></span>',
              '<span class="pill">Domaine callback : <strong>${esc(callbackOrigin)}</strong></span>'
          )
          replace_once(
              "app/admin/social/route.js",
              'Ordre conseillé : 1) rattacher et vérifier d4d5d6.com ; 2) créer les apps et leurs secrets serveur ; 3) copier exactement les callbacks affichés ; 4) revenir ici et cliquer Connecter ; 5) conserver social_test_mode=TRUE jusqu’aux dry-runs et validations humaines.',
              'Ordre conseillé : 1) créer les apps et leurs secrets serveur ; 2) copier exactement les callbacks affichés ; 3) revenir ici et cliquer Connecter ; 4) conserver social_test_mode=TRUE jusqu’aux dry-runs et validations humaines. Le domaine d4d5d6.com pourra remplacer l’alias Vercel après validation DNS sans bloquer les premiers OAuth.'
          )

          # Safe env names only. Sandbox remains the default until explicitly disabled.
          env_path = Path(".env.example")
          env_text = env_path.read_text()
          anchor = "THREADS_OAUTH_SCOPES=\nLINKEDIN_CLIENT_ID="
          if anchor not in env_text:
              raise SystemExit(".env.example: social OAuth anchor missing")
          env_text = env_text.replace(anchor, "THREADS_OAUTH_SCOPES=\nPINTEREST_APP_ID=\nPINTEREST_APP_SECRET=\nPINTEREST_OAUTH_SCOPES=\nPINTEREST_BOARD_ID=\nPINTEREST_SANDBOX=true\nLINKEDIN_CLIENT_ID=", 1)
          env_path.write_text(env_text)

          # Tests: seventh OAuth provider + direct-first Pinterest planning.
          replace_once(
              "tests/social-oauth.test.mjs",
              '  THREADS_APP_ID: "threads-id",\n  THREADS_APP_SECRET: "threads-secret",',
              '  THREADS_APP_ID: "threads-id",\n  THREADS_APP_SECRET: "threads-secret",\n  PINTEREST_APP_ID: "pin-id",\n  PINTEREST_APP_SECRET: "pin-secret",'
          )
          replace_once(
              "tests/social-oauth.test.mjs",
              'test("les six providers OAuth exposent un callback HTTPS sur le domaine canonique", () => {\n  const readiness = oauthProviderReadiness(base);\n  assert.equal(readiness.length, 6);',
              'test("les sept providers OAuth exposent un callback HTTPS sur le domaine canonique", () => {\n  const readiness = oauthProviderReadiness(base);\n  assert.equal(readiness.length, 7);'
          )
          oauth_test = Path("tests/social-oauth.test.mjs")
          oauth_text = oauth_test.read_text()
          if 'test("Pinterest prépare OAuth' not in oauth_text:
              oauth_text += '\n\ntest("Pinterest prépare OAuth avec les scopes organiques sans exposer le secret", () => {\n  const auth = buildSocialAuthorization("pinterest", base);\n  const url = new URL(auth.url);\n  assert.equal(url.origin, "https://www.pinterest.com");\n  assert.match(url.searchParams.get("scope") || "", /pins:write/);\n  assert.match(url.searchParams.get("scope") || "", /boards:read/);\n  assert.equal(auth.url.includes("pin-secret"), false);\n});\n'
              oauth_test.write_text(oauth_text)

          gateway_test = Path("tests/social-gateway.test.mjs")
          gateway_text = gateway_test.read_text()
          if 'test("Pinterest utilise l API directe' not in gateway_text:
              gateway_text += '\n\ntest("Pinterest utilise l API directe avant le webhook en mode auto et reste en dry-run", async () => {\n  const env = {\n    PINTEREST_ACCESS_TOKEN: "pin-token",\n    PINTEREST_BOARD_ID: "12345",\n    HIBOU_SOCIAL_PINTEREST_WEBHOOK_URL: "https://example.com/pinterest",\n  };\n  const status = socialGatewayStatus(env).find((item) => item.provider === "pinterest");\n  assert.equal(status.mode, "direct");\n  assert.deepEqual(status.direct_capabilities, ["image_native", "video_native"]);\n  assert.equal(JSON.stringify(status).includes("pin-token"), false);\n  const plan = await dispatchSocialPost({ provider: "pinterest", media_url: "https://example.com/video.mp4", caption: "Test", dry_run: true }, env);\n  assert.equal(plan.dry_run, true);\n  assert.equal(plan.gateway.mode, "direct");\n});\n'
              gateway_test.write_text(gateway_text)

          runtime_test = Path("tests/social-runtime.test.mjs")
          runtime_text = runtime_test.read_text()
          runtime_text = runtime_text.replace('    social_mode_x: "invalid",', '    social_mode_pinterest: "direct",\n    social_mode_x: "invalid",', 1)
          runtime_text = runtime_text.replace('  assert.equal(env.HIBOU_SOCIAL_YOUTUBE_MODE, "webhook");', '  assert.equal(env.HIBOU_SOCIAL_YOUTUBE_MODE, "webhook");\n  assert.equal(env.HIBOU_SOCIAL_PINTEREST_MODE, "direct");', 1)
          runtime_test.write_text(runtime_text)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Commit only after tests and production build pass
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/social-direct-phase2-pinterest.yml
          git config user.name "hibou-social-migration[bot]"
          git config user.email "hibou-social-migration[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add Pinterest direct OAuth and native publishing"
          git push origin HEAD:hibou-social-direct-api-20260915
