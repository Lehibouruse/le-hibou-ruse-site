name: Hibou Social Metrics

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://le-hibou-ruse-site.vercel.app' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync bounded social metrics
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"
          response_file=$(mktemp)
          set +e
          http_code=$(curl --silent --show-error \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            "${HIBOU_BASE_URL}/api/social-metrics")
          curl_rc=$?
          set -e
          response=$(cat "$response_file")
          rm -f "$response_file"
          printf '%s\n' "$response"
          printf 'social_metrics_http=%s curl_rc=%s\n' "$http_code" "$curl_rc"
          if [ "$curl_rc" -ne 0 ]; then exit "$curl_rc"; fi
          # 404 is tolerated until the current Vercel build-rate-limit clears and main is deployed.
          case "$http_code" in
            200|201|202|204|404) ;;
            *) echo "Social metrics HTTP failure: $http_code" >&2; exit 1 ;;
          esac
