name: Hibou Social Metrics

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://le-hibou-ruse-site.vercel.app' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync bounded social metrics and propose experiments
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          call_endpoint() {
            local label="$1"
            local endpoint="$2"
            local response_file
            response_file=$(mktemp)
            set +e
            local http_code
            http_code=$(curl --silent --show-error \
              -o "$response_file" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              "${HIBOU_BASE_URL}${endpoint}")
            local curl_rc=$?
            set -e
            local response
            response=$(cat "$response_file")
            rm -f "$response_file"
            printf '%s=%s\n' "$label" "$response"
            printf '%s_http=%s curl_rc=%s\n' "$label" "$http_code" "$curl_rc"
            if [ "$curl_rc" -ne 0 ]; then return "$curl_rc"; fi
            # 404 is tolerated only while Vercel has not deployed the latest main.
            case "$http_code" in
              200|201|202|204|404) return 0 ;;
              *) echo "$label HTTP failure: $http_code" >&2; return 1 ;;
            esac
          }

          call_endpoint social_metrics /api/social-metrics
          call_endpoint growth_experiments /api/growth-experiments
