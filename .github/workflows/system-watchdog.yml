name: Hibou System Watchdog

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  HIBOU_BASE_URL: ${{ vars.HIBOU_PUBLIC_BASE_URL || 'https://le-hibou-ruse-site.vercel.app' }}

concurrency:
  group: hibou-system-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect and safely reconcile system health
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hibou-orchestrator")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")
          echo "::add-mask::$token"

          response=""
          code=""
          rc=0
          for attempt in 1 2 3; do
            response_file=$(mktemp)
            set +e
            code=$(curl --silent --show-error -o "$response_file" -w '%{http_code}' \
              -X POST -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
              "${HIBOU_BASE_URL}/api/system-watchdog")
            rc=$?
            set -e
            response=$(cat "$response_file")
            rm -f "$response_file"
            printf '%s\n' "$response"
            printf 'watchdog_http=%s curl_rc=%s attempt=%s\n' "$code" "$rc" "$attempt"

            if [ "$rc" -ne 0 ]; then
              echo "Watchdog transport failure" >&2
              exit "$rc"
            fi
            if [ "$code" != "404" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Watchdog returned 404; allowing brief deployment propagation before retry"
              sleep 15
            fi
          done

          if [ "$code" = "404" ]; then
            echo "Persistent 404 after deployment grace window: watchdog route missing" >&2
            exit 1
          fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Watchdog HTTP failure: $code" >&2
            exit 1
          fi
          severity=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("severity","critical"))' <<< "$response")
          echo "severity=$severity"
          if [ "$severity" = "critical" ]; then
            echo "Critical Hibou system health issue" >&2
            exit 1
          fi
