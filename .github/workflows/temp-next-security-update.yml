name: Temporary Next security lockfile updater

on:
  push:
    branches:
      - security-next-16-3-6

permissions:
  contents: write

concurrency:
  group: security-next-16-3-6
  cancel-in-progress: true

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: security-next-16-3-6
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Generate security patch lockfile
        run: npm install --save-exact --package-lock-only next@16.3.6
      - name: Commit generated manifest and lockfile
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js to 16.3.6 security patch"
          git push origin HEAD:security-next-16-3-6
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Clean install
        if: steps.commit.outputs.changed == 'false'
        run: npm ci
      - name: Unit tests
        if: steps.commit.outputs.changed == 'false'
        run: npm test
      - name: Production build
        if: steps.commit.outputs.changed == 'false'
        run: npm run build
