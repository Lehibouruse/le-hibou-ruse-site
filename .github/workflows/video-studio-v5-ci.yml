name: Video Studio V5 branch CI

on:
  push:
    branches:
      - feat/video-studio-v5
      - 'feat/video-studio-v5-*'

permissions:
  contents: read

concurrency:
  group: video-studio-v5-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JS syntax
        run: |
          node --check scripts/video-scene-compositor.mjs
          node --check scripts/video-hibou-pose-registry.mjs
          node --check scripts/video-prosody-plan.mjs
          node --check scripts/video-voice-duration-qc.mjs
          node --check scripts/video-audio-mix.mjs
          node --check scripts/video-iteration-plan.mjs
          node --check scripts/video-job-lineage.mjs
          node --check scripts/video-v5-readiness.mjs
          node --check scripts/video-asset-readiness.mjs
          node --check scripts/video-continuity-plan.mjs
          node --check scripts/video-artifact-registry.mjs
          node --check scripts/video-human-review-package.mjs
          node --check scripts/video-review-diff.mjs
          node --check scripts/video-methodology-coverage.mjs
          node --check scripts/video-durable-storage-plan.mjs
          node --check scripts/video-resume-plan.mjs
          node --check scripts/video-resume-state.mjs
          node --check scripts/video-run-audit.mjs
          node --check scripts/video-candidate-review.mjs
          node --check scripts/video-candidate-selection-apply.mjs
          node --check scripts/video-image-plan.mjs
          node --check scripts/video-image-batch.mjs
          node --check scripts/video-local-render.mjs
          node --check scripts/hibou-github-worker.mjs
          node --check scripts/video-master.mjs
          node --check scripts/video-storyboard-promote.mjs
          node --check scripts/video-airtable-sync.mjs
          node --check app/api/local-worker-queue/route.js
      - name: Methodology coverage
        run: node scripts/video-methodology-coverage.mjs docs/video-methodology-coverage-v5.json /tmp/video-methodology-coverage.json
      - name: Python syntax only
        run: |
          python3 -m py_compile scripts/video-creative-qc.py
          python3 -m py_compile scripts/chatterbox-storyboard-batch.py
      - name: V5 targeted CPU tests
        run: |
          node --test \
            tests/video-scene-timeline-v1.test.mjs \
            tests/video-creative-qc.test.mjs \
            tests/video-hibou-pose-registry.test.mjs \
            tests/video-layer-guard.test.mjs \
            tests/video-prosody-plan.test.mjs \
            tests/video-voice-duration-qc.test.mjs \
            tests/video-voice-duration-retry.test.mjs \
            tests/video-audio-mix.test.mjs \
            tests/video-iteration-plan.test.mjs \
            tests/video-image-plan.test.mjs \
            tests/video-image-batch.test.mjs \
            tests/video-incremental-reuse.test.mjs \
            tests/video-job-lineage.test.mjs \
            tests/video-job-lineage-integration.test.mjs \
            tests/video-preview-publication-guard.test.mjs \
            tests/video-v5-readiness.test.mjs \
            tests/video-asset-readiness.test.mjs \
            tests/video-continuity-plan.test.mjs \
            tests/video-candidate-review.test.mjs \
            tests/video-candidate-selection-apply.test.mjs \
            tests/video-human-review-package.test.mjs \
            tests/video-review-diff.test.mjs \
            tests/video-methodology-coverage.test.mjs \
            tests/video-durable-storage-plan.test.mjs \
            tests/video-resume-plan.test.mjs \
            tests/video-resume-state.test.mjs \
            tests/video-worker-failure-resume-diagnostic.test.mjs \
            tests/video-remote-repair-resume.test.mjs \
            tests/video-run-audit.test.mjs \
            tests/video-pipeline-stage-history.test.mjs \
            tests/video-worker-heartbeat-progress.test.mjs \
            tests/video-local-render.test.mjs \
            tests/video-subtitles-font.test.mjs \
            tests/video-remote-cancel.test.mjs \
            tests/video-studio-v5-orchestration.test.mjs
      - name: Existing unit suite
        run: npm test
