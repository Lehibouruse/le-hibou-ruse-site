name: Windows PowerShell Parse

on:
  pull_request:
    paths:
      - "scripts/**/*.ps1"
      - ".github/workflows/windows-powershell-parse.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**/*.ps1"
      - ".github/workflows/windows-powershell-parse.yml"
  workflow_dispatch:

jobs:
  parse-powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = Get-ChildItem -Path "scripts" -Recurse -Filter "*.ps1" -File
          if (-not $scripts) {
            throw "No PowerShell scripts found under scripts/."
          }

          $failed = $false
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host ("Parser errors in {0}:" -f $script.FullName) -ForegroundColor Red
              foreach ($err in $errors) {
                Write-Host ("  Line {0}, Column {1}: {2}" -f $err.Extent.StartLineNumber, $err.Extent.StartColumnNumber, $err.Message) -ForegroundColor Red
                Write-Host ("    ErrorId={0}; Extent={1}" -f $err.ErrorId, ($err.Extent.Text -replace "[`r`n]+", " ")) -ForegroundColor DarkRed
              }

              Write-Host "  Nearby parser tokens:" -ForegroundColor Yellow
              $errorLines = @($errors | ForEach-Object { $_.Extent.StartLineNumber })
              $minLine = [Math]::Max(1, (($errorLines | Measure-Object -Minimum).Minimum - 8))
              $maxLine = (($errorLines | Measure-Object -Maximum).Maximum + 8)
              foreach ($token in $tokens) {
                $line = $token.Extent.StartLineNumber
                if ($line -ge $minLine -and $line -le $maxLine) {
                  $text = ($token.Text -replace "[`r`n]+", "\\n")
                  if ($text.Length -gt 180) { $text = $text.Substring(0, 180) + "..." }
                  Write-Host ("    {0}:{1}-{2}:{3} {4} [{5}]" -f $token.Extent.StartLineNumber, $token.Extent.StartColumnNumber, $token.Extent.EndLineNumber, $token.Extent.EndColumnNumber, $token.Kind, $text)
                }
              }
            } else {
              Write-Host ("PASS {0}" -f $script.FullName) -ForegroundColor Green
            }
          }

          if ($failed) {
            exit 1
          }
